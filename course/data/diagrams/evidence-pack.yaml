# Used in: project-retrospective (hands-on). The five parts of an evidence pack.
template: summary
title:
  vi: Năm phần của gói bằng chứng
  en: The Five Parts of an Evidence Pack
  ja: 証拠のまとめの5つの部分
points:
  - icon: "🎯"
    color: blue
    name: {vi: Yêu cầu, en: The spec, ja: 依頼内容}
    caption: {vi: "Mục tiêu và\ntiêu chí hoàn thành", en: "Goal and\ndefinition of done", ja: "目標と\n完了条件"}
  - icon: "⏱️"
    color: teal
    name: {vi: Trước và sau, en: Before and after, ja: 前と後}
    caption: {vi: "Trước làm thế nào;\ngiờ chạy lệnh nào", en: "How it was done;\nthe command now", ja: "以前のやり方と\n今のコマンド"}
  - icon: "✅"
    color: green
    name: {vi: Các phép kiểm tra, en: The checks, ja: 確認}
    caption: {vi: "Chạy gì, kết quả,\nlần làm hỏng thử", en: "What ran, the result,\nthe break test", ja: "何を実行し、結果は、\nわざと壊した結果"}
  - icon: "🚧"
    color: rose
    name: {vi: Giới hạn, en: Limits, ja: 限界}
