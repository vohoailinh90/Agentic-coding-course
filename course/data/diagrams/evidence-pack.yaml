  - icon: "🔧"
    color: amber
    name: {vi: Một cải tiến, en: One improvement, ja: 改善を1つ}
    caption: {vi: "Một điều làm khác\nlần sau", en: "One thing to do\ndifferently next time", ja: "次に変える\nことを1つ"}
takeaway:
  vi: Viết đủ để một người không có mặt vẫn chạy lại và kiểm tra được.
  en: Enough for someone who wasn't there to rerun it and check it.
  ja: その場にいなかった人でも、再実行して確かめられるように。
