takeaway:
  vi: Chọn định dạng theo ai sẽ đọc nó — người, bảng tính hay chương trình.
  en: Choose the format by who reads it — a person, a spreadsheet or a program.
  ja: 読むのは人か、表計算か、プログラムか。それで形式を選ぶ。
