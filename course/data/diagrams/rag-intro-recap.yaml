takeaway:
  vi: Hỏi về tài liệu riêng? Cho AI tra cứu, rồi tự mở nguồn đối chiếu.
  en: Asking about your own documents? Let AI look them up, then check the source.
  ja: 自分の資料について聞くなら、AIに調べさせ、出典は自分で確かめる。
