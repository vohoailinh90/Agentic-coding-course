# Used in security-basics: safe and unsafe homes for secrets.
template: compare
title:
  vi: Bí mật được ở đâu?
  en: Where May a Secret Live?
  ja: 秘密情報はどこに置ける？
rows:
  - vi: Ví dụ
    en: Example
    ja: 例
  - vi: Khi chia sẻ
    en: When sharing
    ja: 共有するとき
columns:
  - icon: "✅"
    color: green
    name:
      vi: Được
      en: May live here
      ja: 置いてよい
    values:
      - vi: Biến môi trường
        en: Environment variable
        ja: 環境変数
      - vi: Giá trị không vào code
        en: Value stays out of code
        ja: 値はコードの外
    highlight: true
  - icon: "✋"
    color: amber
    name:
      vi: Kiểm tra
      en: Check first
      ja: 先に確認
    values:
      - vi: File Git bỏ qua
        en: Git-ignored file
        ja: Gitが無視するファイル
      - vi: Tìm bí mật trước
        en: Search for secrets
        ja: 秘密を先に探す
  - icon: "⛔"
    color: rose
    name:
      vi: Không bao giờ
      en: Never
      ja: 絶対に禁止
    values:
      - vi: Code, chat, ảnh chụp
        en: Code, chat, screenshots
        ja: "コード・チャット・\n画面写真"
      - vi: Không đăng công khai
        en: Never publish
        ja: 公開しない
emphasis_row: 2
takeaway:
  vi: Giá trị thật ở ngoài code; ví dụ chỉ dùng sk-...
  en: Keep real values out of code; examples use only sk-...
  ja: 実際の値はコードの外へ。例はsk-...だけ。
