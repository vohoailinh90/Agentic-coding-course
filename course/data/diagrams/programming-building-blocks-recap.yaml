takeaway:
  vi: Không cần tự viết code — cần đọc ra được bốn viên gạch và nói đúng tên.
  en: You do not need to write code — you need to spot the four blocks and name them.
  ja: "コードは書けなくていい。\n4つの部品を見分けて、名前で伝えよう。"
