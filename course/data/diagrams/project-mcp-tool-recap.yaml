takeaway:
  vi: Một công cụ nhỏ, đã kiểm tra, đáng tin hơn một agent tự tính.
  en: A small, tested tool beats an agent doing sums.
  ja: 確かめた小さなツールは、エージェントの暗算より信頼できる。
