  - icon: "🧮"
    color: green
    name: {vi: Code tính số, en: Code does the maths, ja: 計算はコード}
    caption: {vi: "Không để mô hình\n\"tính nhẩm\"", en: "Not the model's\nmental arithmetic", ja: "モデルの\n暗算に頼らない"}
  - icon: "✅"
    color: teal
    name: {vi: "Kiểm tra\ntrước khi nối", en: "Test before\nconnecting", ja: "つなぐ前に\n確かめる"}
