  - icon: "🧱"
    color: rose
    name: {vi: Bốn mặt, en: Four sides, ja: 4つの面}
    caption: {vi: "Đầu vào, đầu ra,\nlỗi, ranh giới", en: "Input, output,\nerrors, limits", ja: "入力・出力・\nエラー・境界"}
  - icon: "🧹"
    color: slate
