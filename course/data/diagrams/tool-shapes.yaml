    color: green
    highlight: true
    name: {vi: Agent trên máy, en: Local agent, ja: 手元のエージェント}
    values:
      - {vi: Máy bạn, en: Your computer, ja: 自分のPC}
      - {vi: "Thư mục\ncủa bạn", en: Your folder, ja: 自分のフォルダ}
