      - {vi: "Kho code\ntrên mạng", en: "An online\nrepository", ja: オンラインのリポジトリ}
      - {vi: "Có, trên\nmáy chủ", en: "Yes, on\nthe server", ja: サーバー上で実行}
      - {vi: "Không cài được,\ncó GitHub", en: "No installs,\nhave GitHub", ja: "インストール不可\nGitHubあり"}
takeaway:
  vi: Chọn hình dạng theo môi trường trước, rồi mới so tên hãng.
  en: Pick the shape for your environment first, then compare brands.
  ja: まず環境に合うかたちを選び、それから製品を比べます。
