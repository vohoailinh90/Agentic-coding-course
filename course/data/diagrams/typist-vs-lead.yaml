    name:
      vi: Người gõ code
      en: The typist
      ja: タイピスト
    values:
      - vi: Gõ từng dòng
        en: Typing every line
        ja: 1行ずつ入力する
      - vi: Viết lệnh này thế nào?
        en: How do I write this?
