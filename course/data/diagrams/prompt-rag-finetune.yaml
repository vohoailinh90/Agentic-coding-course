# Used in: prompt-rag-finetune-compare (concept). Three ways to fit AI to a job, by what each one changes.
template: compare
title:
  vi: "Prompt, RAG, fine-tuning: đổi chỗ nào?"
  en: "Prompt, RAG, Fine-Tuning: What Changes?"
  ja: 3つの方法は、何を変える？
rows:
  - vi: Thay đổi gì?
    en: What changes
    ja: 変えるもの
  - vi: Hợp khi
    en: Good for
    ja: 向いていること
  - vi: Công sức
    en: Effort
    ja: 手間
  - vi: Khi thông tin đổi
    en: When facts change
    ja: 情報が変わったら
emphasis_row: 1
columns:
  - icon: "💬"
