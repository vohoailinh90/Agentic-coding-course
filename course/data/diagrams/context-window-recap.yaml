    color: amber
    name:
      vi: Mỗi việc một phiên
      en: One task per session
      ja: 1つの作業に1セッション
    caption:
      vi: Việc mới không liên quan? Phiên mới
      en: New, unrelated task? New session
      ja: 関係ない作業なら新しいセッション
  - icon: "📝"
    color: green
    name:
      vi: Ghi điều quan trọng ra file
      en: Write what matters to a file
      ja: 大事なことはファイルに
    caption:
      vi: Agent đọc lại được ở phiên sau
      en: The agent can read it next session
      ja: 次のセッションでも読める
takeaway:
  vi: Ngữ cảnh ít mà đúng tốt hơn nhiều mà lộn xộn.
  en: A little of the right context beats a lot of clutter.
  ja: 少なくて的確な文脈は、多くて雑多な文脈にまさる。
