# Course tree: modules -> units -> lessons. Schema: docs/data-model.md.
#
# ROADMAP v1 — adopted from the Codex brainstorm (brainstorm/round-1.md) with the
# course owner's decisions, see docs/decisions/007-roadmap-v1.md: hands-on from
# the first sitting, software and AI theory just in time, deep internals and
# most harness engineering in optional or advanced units.
#
# Rules the validator enforces (python -m src.main validate):
#   - ids are kebab-case slugs, unique across the whole tree, and never reused
#     (see `retired` at the end). Order comes from position in this file, never
#     from the id, so moving a lesson keeps its id, its files and every post that
#     links to it.
#   - every title/goal carries vi, en and ja.
#   - type is one of: concept | demo | hands-on | project; minutes is a positive integer.
#   - terms are ids from course/data/glossary.yaml; icon (optional) is one emoji per module.
#   - track (optional, per unit) is core (the default) | optional | advanced.
version: 1.0.0-draft

modules:
  - id: first-win
    icon: "🚀"
    title:
      vi: Bắt đầu an toàn, làm được ngay buổi đầu
      en: Start Safely and Get a First Win
      ja: 安全に始めて、最初の成功体験を
    goal:
      vi: Hiểu AI agent khác chatbot ở đâu, chọn cách thực hành an toàn trên máy của mình, rồi nhờ agent làm sản phẩm đầu tiên và tự kiểm tra.
      en: See how an AI agent differs from a chatbot, choose a safe way to practise on your own device, then have an agent build your first small artifact and check it yourself.
      ja: AIエージェントとチャットボットの違いを知り、自分の環境で安全に練習する方法を選び、エージェントに最初の小さな成果物を作らせて自分で確かめる。
    units:
      - id: what-agents-do
        title:
          vi: AI agent làm được gì
          en: What Agents Do
          ja: エージェントにできること
        lessons:
          - id: chatbot-to-agent
            title:
              vi: "Từ chatbot đến AI agent: AI không chỉ trả lời mà còn làm việc"
              en: "From Chatbot to AI Agent: AI That Does the Work, Not Just Answers"
              ja: チャットボットからAIエージェントへ：答えるだけでなく、仕事をするAI
            type: concept
            minutes: 8
            terms: [chatbot, llm, ai-agent, agentic-coding]
          - id: agent-parts-and-loop
            title:
              vi: "Bộ não, đôi tay và vòng lặp: AI agent được ghép từ gì?"
              en: "Brain, Tools and the Loop: What an AI Agent Is Made Of"
              ja: 頭脳・道具・ループ：AIエージェントは何でできている？
            type: concept
            minutes: 8
            terms: [llm, tool, agent-loop]
          - id: watch-an-agent-build
            title:
              vi: Xem AI agent làm và tự kiểm tra một trang web nhỏ
              en: Watch an AI Agent Build and Check a Tiny Web Page
              ja: AIエージェントが小さなWebページを作って確かめる様子を見よう
            type: demo
            minutes: 10
            terms: [agent-loop, code]
      - id: safe-route
        title:
          vi: Chọn cách học an toàn
          en: Choose a Safe Route
          ja: 安全な学び方を選ぶ
        lessons:
          - id: choose-your-learning-setup
            title:
              vi: "Chọn cách thực hành: trình duyệt, máy cá nhân hay máy công ty"
              en: "Choose Your Setup: Browser, Personal PC or Work PC"
              ja: 練習環境を選ぶ：ブラウザ、個人のPC、会社のPC
            type: hands-on
            minutes: 10
          - id: data-safety-and-permissions
            title:
              vi: "Trước khi để agent làm việc: việc an toàn, việc phải hỏi, việc bị cấm"
              en: "Before You Let an Agent Act: Safe, Ask First, Never"
              ja: エージェントに任せる前に：安全・要確認・禁止を分ける
            type: concept
            minutes: 10
      - id: first-build
        title:
          vi: Sản phẩm đầu tiên
          en: Your First Build
          ja: はじめての成果物
        lessons:
          - id: first-agent-session
            title:
              vi: "Buổi đầu với agent: làm một trang \"Việc của tôi trong tuần\""
              en: "Your First Agent Session: Build a One-File Task Card"
              ja: はじめてのエージェント体験：1ファイルのタスクカードを作る
            type: hands-on
            minutes: 25
            terms: [ai-agent]
          - id: how-to-learn-this-course
            title:
              vi: Chọn lộ trình và ghi nhật ký học
              en: Choose Your Path and Keep a Learning Log
              ja: 学ぶルートを選び、学習ログをつける
            type: hands-on
            minutes: 8

  - id: direct-and-check
    icon: "🧭"
    title:
      vi: Giao việc, kiểm tra và sửa cùng agent
      en: Direct, Check and Improve an Agent
      ja: エージェントに指示し、確かめ、改善する
    goal:
      vi: Giao cho agent một việc rõ ràng, kiểm tra từng thay đổi bằng bằng chứng, và hoàn thành dự án có ý nghĩa đầu tiên.
      en: Give an agent clear work, check every change against evidence, and finish your first meaningful project.
      ja: エージェントに明確な仕事を渡し、すべての変更を証拠で確かめ、最初の意味のあるプロジェクトを完成させる。
    units:
      - id: clear-work
        title:
          vi: Giao việc rõ ràng
          en: Give Clear Work
          ja: 明確に仕事を渡す
        lessons:
          - id: lead-not-typist
            title:
              vi: "Tư duy mới: bạn là trưởng nhóm, không phải người gõ code"
              en: "New Mindset: You Are the Lead, Not the Typist"
              ja: 新しい考え方：あなたはタイピストではなくリーダー
            type: concept
            minutes: 8
          - id: writing-good-specs
            title:
              vi: "Viết yêu cầu tốt: mô tả việc và tiêu chí hoàn thành"
              en: "Writing Good Specs: The Task and Its Definition of Done"
              ja: 良い指示書の書き方：タスクと完了条件
            type: hands-on
            minutes: 12
            terms: [spec, acceptance-criteria]
          - id: explore-plan-build-verify
            title:
              vi: "Quy trình 4 bước: Tìm hiểu → Lập kế hoạch → Thực hiện → Kiểm chứng"
              en: "The Four-Step Workflow: Explore → Plan → Build → Verify"
              ja: 4ステップのワークフロー：調べる→計画する→作る→検証する
            type: hands-on
            minutes: 12
      - id: inspect-results
        title:
          vi: Kiểm tra kết quả
          en: Inspect the Result
          ja: 結果を確かめる
        lessons:
          - id: files-folders-paths
            title:
              vi: "File, thư mục và đường dẫn: tấm bản đồ bên trong máy tính"
              en: "Files, Folders and Paths: The Map Inside Your Computer"
              ja: ファイル・フォルダ・パス：パソコンの中の地図
            type: hands-on
            minutes: 10
            terms: [file-path]
          - id: reviewing-agent-changes
            title:
              vi: Đọc và review thay đổi của agent (diff)
              en: Reading and Reviewing an Agent's Changes (Diffs)
              ja: エージェントの変更（差分）を読んでレビューする
            type: hands-on
            minutes: 15
            terms: [diff]
          - id: testing-basics
            title:
              vi: Từ "trông có vẻ đúng" đến phép kiểm tra
              en: Turn "Looks Right" into Checks
              ja: 「たぶん合っている」をチェックに変える
            type: hands-on
            minutes: 12
            terms: [test]
          - id: errors-and-debugging
            title:
              vi: Đọc thông báo lỗi và gỡ lỗi như một thám tử
              en: Reading Error Messages and Debugging Like a Detective
              ja: エラーメッセージを読み、探偵のようにデバッグする
            type: hands-on
            minutes: 12
            terms: [bug, debugging]
      - id: first-project
        title:
          vi: Dự án đầu tiên
          en: Your First Project
          ja: 最初のプロジェクト
        lessons:
          - id: project-personal-page
            title:
              vi: "Dự án: trang web cá nhân của bạn"
              en: "Project: Your Personal Web Page"
              ja: プロジェクト：自分のWebページ
            type: project
            minutes: 60

  - id: software-literacy
    icon: "🧱"
    title:
      vi: Hiểu phần mềm vừa đủ, đúng lúc cần
      en: Software Literacy, Just in Time
      ja: 必要なときに学ぶソフトウェアの基礎
    goal:
      vi: Đọc hiểu những gì agent vừa tạo — file, thư mục, dữ liệu, mã và lịch sử thay đổi — đủ để giám sát và hoàn tác an toàn.
      en: Understand what the agent just made — files, folders, data, code and history — well enough to supervise it and undo safely.
      ja: エージェントが作ったもの（ファイル、フォルダー、データ、コード、変更履歴）を、監督して安全に元に戻せる程度に理解する。
    units:
      - id: files-and-projects
        title:
          vi: File và dự án
          en: Files and Projects
          ja: ファイルとプロジェクト
        lessons:
          - id: what-is-software
            title:
              vi: Phần mềm là gì? Chương trình giống một công thức nấu ăn
              en: What Is Software? A Program Is Like a Recipe
              ja: ソフトウェアとは？プログラムはレシピのようなもの
            type: concept
            minutes: 8
            terms: [software, program, code]
          - id: project-anatomy
            title:
              vi: "Giải phẫu một dự án: frontend, backend, database, API"
              en: "Anatomy of a Project: Frontend, Backend, Database, API"
              ja: プロジェクトの解剖：フロントエンド・バックエンド・データベース・API
            type: concept
            minutes: 10
            terms: [api]
          - id: data-formats
            title:
              vi: "Dữ liệu trông như thế nào: JSON, CSV, YAML"
              en: "What Data Looks Like: JSON, CSV and YAML"
              ja: データの形：JSON・CSV・YAML
            type: hands-on
            minutes: 10
            terms: [json]
      - id: code-and-history
        title:
          vi: Mã và lịch sử thay đổi
          en: Code and History
          ja: コードと変更履歴
        lessons:
          - id: programming-building-blocks
            title:
              vi: "Biến, hàm, điều kiện, vòng lặp: 4 viên gạch thường gặp"
              en: "Variables, Functions, Conditions, Loops: Four Common Building Blocks"
              ja: 変数・関数・条件分岐・ループ：よく使う4つの部品
            type: concept
            minutes: 12
            terms: [program, code]
          - id: git-version-control
            title:
              vi: "Git: nút Undo thần kỳ cho cả dự án"
              en: "Git: A Magic Undo Button for Your Whole Project"
              ja: Git：プロジェクト全体の「元に戻す」ボタン
            type: hands-on
            minutes: 15
            terms: [git, commit, diff]
          - id: command-line-basics
            title:
              vi: "Terminal không đáng sợ: 5 lệnh an toàn đầu tiên"
              en: "The Terminal Is Not Scary: Your First Five Safe Commands"
              ja: ターミナルはこわくない：最初の安全な5つのコマンド
            type: hands-on
            minutes: 15
            terms: [terminal]
      - id: security-essentials
        title:
          vi: An toàn là trên hết
          en: Security Essentials
          ja: セキュリティの基本
        lessons:
          - id: security-basics
            title:
              vi: "An toàn cơ bản: API key, mật khẩu và dữ liệu cá nhân"
              en: "Safety Basics: API Keys, Passwords and Personal Data"
              ja: 安全の基本：APIキー・パスワード・個人情報
            type: concept
            minutes: 12
            terms: [api-key]

  - id: ai-mental-models
    icon: "🧠"
    title:
      vi: Những hiểu biết về AI bạn thật sự cần
      en: The AI Mental Models You Actually Need
      ja: 本当に必要なAIの考え方
    goal:
      vi: Biết vì sao câu trả lời trôi chảy của AI vẫn có thể sai, agent nhìn thấy gì và dùng công cụ ra sao; phần lý thuyết sâu hơn là tùy chọn.
      en: Know why a fluent AI answer can still be wrong, what an agent can see and how it uses tools; the deeper theory is optional.
      ja: 流暢なAIの答えがなぜ間違いうるか、エージェントに何が見えていて道具をどう使うかを知る。より深い理論は任意。
    units:
      - id: asking-and-grounding
        title:
          vi: Hỏi đúng và đòi bằng chứng
          en: Asking and Grounding
          ja: 上手に頼み、根拠を求める
        lessons:
          - id: prompting-basics
            title:
              vi: "Prompt căn bản: nói sao cho AI hiểu"
              en: "Prompting Basics: Talking So AI Understands"
              ja: プロンプトの基本：AIに伝わる話し方
            type: hands-on
            minutes: 12
            terms: [prompt]
          - id: hallucination
            title:
              vi: "Ảo giác AI: vì sao AI tự tin nói sai"
              en: "Hallucination: Why AI Is Confidently Wrong"
              ja: ハルシネーション：AIが自信満々に間違える理由
            type: concept
            minutes: 10
            terms: [hallucination]
          - id: context-window
            title:
              vi: "Cửa sổ ngữ cảnh: trí nhớ ngắn hạn của AI"
              en: "The Context Window: AI's Short-Term Memory"
              ja: コンテキストウィンドウ：AIの短期記憶
            type: concept
            minutes: 10
            terms: [context-window]
          - id: next-token-prediction
            title:
              vi: "Đoán chữ tiếp theo: bí mật đơn giản đằng sau LLM"
              en: "Next-Token Prediction: The Simple Secret Behind LLMs"
              ja: 次のトークンの予測：LLMのシンプルな秘密
            type: concept
            minutes: 10
            terms: [llm, token]
          - id: tool-calling
            title:
              vi: "Gọi công cụ: cách LLM \"bấm nút\" ngoài đời thật"
              en: "Tool Calling: How an LLM Presses Real Buttons"
              ja: ツール呼び出し：LLMが現実のボタンを押すしくみ
            type: demo
            minutes: 10
            terms: [function-calling, tool]
      - id: ai-foundations
        track: optional
        title:
          vi: Nền tảng AI
          en: AI Foundations
          ja: AIの基礎
        lessons:
          - id: ai-ml-dl
            title:
              vi: "Gia phả của AI trong một hình: từ machine learning đến LLM"
              en: "The AI Family Tree in One Picture: From Machine Learning to LLMs"
              ja: 1枚でわかるAIの系統図：機械学習からLLMまで
            type: concept
            minutes: 8
            terms: [machine-learning, deep-learning, generative-ai, foundation-model]
          - id: how-machines-learn
            title:
              vi: Máy "học" như thế nào? Dữ liệu, huấn luyện và mô hình
              en: How Do Machines "Learn"? Data, Training and Models
              ja: 機械はどうやって「学ぶ」？データ・学習・モデル
            type: concept
            minutes: 10
            terms: [model, training]
          - id: rag-intro
            title:
              vi: "RAG: cho AI mở tài liệu ra tra cứu"
              en: "RAG: Letting AI Look Things Up"
              ja: RAG：AIに資料を調べさせる
            type: demo
            minutes: 10
            terms: [rag]
          - id: prompt-rag-finetune-compare
            title:
              vi: "Prompt, RAG hay fine-tuning: chọn cách nào?"
              en: "Prompting, RAG or Fine-Tuning: Which One When?"
              ja: プロンプト・RAG・ファインチューニング：どれを選ぶ？
            type: concept
            minutes: 10
            terms: [prompt, rag, fine-tuning]
      - id: model-literacy
        track: optional
        title:
          vi: Hiểu về mô hình
          en: Model Literacy
          ja: モデルを知る
        lessons:
          - id: tokens
            title:
              vi: "Token: AI đọc chữ theo từng mảnh"
              en: "Tokens: How AI Reads Text in Pieces"
              ja: トークン：AIは文章を小さな断片で読む
            type: demo
            minutes: 8
            terms: [token]
          - id: reasoning-models
            title:
              vi: "Mô hình biết \"suy nghĩ\": reasoning là gì?"
              en: "Models That \"Think\": What Is Reasoning?"
              ja: 「考える」モデル：推論（リーズニング）とは？
            type: concept
            minutes: 10
            terms: [llm, reasoning-model]
          - id: choosing-models
            title:
              vi: "Chọn mô hình: to hay nhỏ, nhanh hay chậm, rẻ hay đắt"
              en: "Choosing a Model: Big or Small, Fast or Slow, Cheap or Costly"
              ja: モデルの選び方：大きさ・速さ・コスト
            type: hands-on
            minutes: 10
            terms: [token, model]

  - id: reliable-agent-work
    icon: "🧰"
    title:
      vi: Làm việc với agent một cách đáng tin cậy
      en: Reliable Agent Work
      ja: 信頼できるエージェント活用
    goal:
      vi: "Biến agent thành một đồng nghiệp đáng tin: đúng quy trình, đủ ngữ cảnh, quyền hạn rõ ràng và được máy tự kiểm tra."
      en: "Make an agent a dependable colleague: the right workflow, the right context, clear permissions and automatic checks."
      ja: エージェントを頼れる同僚にする：適切な進め方、適切なコンテキスト、明確な権限、そして自動チェック。
    units:
      - id: agentic-work-as-a-system
        title:
          vi: Agentic coding là một hệ thống
          en: Agentic Work as a System
          ja: 仕組みとしてのエージェント開発
        lessons:
          - id: traditional-vs-agentic
            title:
              vi: Lập trình truyền thống và agentic coding
              en: Traditional Coding vs Agentic Coding
              ja: 従来のコーディングとエージェント型コーディング
            type: concept
            minutes: 8
            terms: [agentic-coding]
          - id: vibe-vs-agentic
            title:
              vi: "Vibe coding và agentic coding: khác nhau ở đâu?"
              en: "Vibe Coding vs Agentic Coding: What Is the Difference?"
              ja: バイブコーディングとエージェント型コーディングの違い
            type: concept
            minutes: 8
            terms: [vibe-coding, agentic-coding]
          - id: the-agent-loop
            title:
              vi: Lần theo vòng lặp của agent qua một phiên làm việc thật
              en: Trace an Agent Loop Through a Real Session
              ja: 実際のセッションでエージェントのループをたどる
            type: demo
            minutes: 10
            terms: [agent-loop, tool]
          - id: tool-landscape
            title:
              vi: Chọn công cụ theo môi trường, không theo lời quảng cáo
              en: Choose a Tool by Environment, Not Hype
              ja: 話題性ではなく環境でツールを選ぶ
            type: concept
            minutes: 10
          - id: workflow-frameworks
            title:
              vi: "Thêm quy trình khi việc cần: lập kế hoạch, viết test trước, duyệt lại"
              en: "Add Structure When the Task Needs It: Plans, Tests First, Reviews"
              ja: 必要なときに型を足す：計画、テスト先行、レビュー
            type: concept
            minutes: 10
            terms: [test]
      - id: minimum-harness
        title:
          vi: Harness tối thiểu
          en: The Minimum Useful Harness
          ja: 最小限のハーネス
        lessons:
          - id: model-plus-harness
            title:
              vi: "Model + Harness = Agent: con ngựa và bộ yên cương"
              en: "Model + Harness = Agent: The Horse and the Reins"
              ja: モデル＋ハーネス＝エージェント：馬と手綱
            type: concept
            minutes: 10
            terms: [harness, model]
          - id: context-engineering
            title:
              vi: "Context engineering: đưa đúng thông tin, đúng lúc"
              en: "Context Engineering: The Right Information at the Right Time"
              ja: コンテキストエンジニアリング：必要な情報を必要なときに
            type: hands-on
            minutes: 20
            terms: [context-engineering, context-window]
          - id: prompt-engineering-for-agents
            title:
              vi: "Prompt engineering cho agent: system prompt và chỉ dẫn"
              en: "Prompt Engineering for Agents: System Prompts and Instructions"
              ja: エージェントのためのプロンプトエンジニアリング：システムプロンプトと指示
            type: hands-on
            minutes: 25
            terms: [prompt]
          - id: hooks-and-permissions
            title:
              vi: "Hooks và phân quyền: hàng rào an toàn tự động"
              en: "Hooks and Permissions: Automatic Guardrails"
              ja: フックと権限：自動のガードレール
            type: hands-on
            minutes: 25
            terms: [hook]
          - id: tests-and-ci-for-agents
            title:
              vi: "Test và CI: để máy kiểm tra máy"
              en: "Tests and CI: Let Machines Check Machines"
              ja: テストとCI：機械に機械をチェックさせる
            type: demo
            minutes: 15
            terms: [test, ci]
      - id: advanced-practice
        track: advanced
        title:
          vi: Thực hành chuyên sâu
          en: Deeper Practice
          ja: さらに深い実践
        lessons:
          - id: memory-and-skills
            title:
              vi: Bộ nhớ dự án và kỹ năng dùng lại
              en: Project Memory and Reusable Skills
              ja: プロジェクトの記憶と再利用できるスキル
            type: hands-on
            minutes: 25
          - id: agents-and-workflows
            title:
              vi: "Agent và workflow: khi nào cần nhiều agent?"
              en: "Agents and Workflows: When Do You Need More Than One Agent?"
              ja: エージェントとワークフロー：複数のエージェントが必要なのはいつ？
            type: concept
