<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="198" y="191.3">バイブコーディング</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="241.5">渡すもの</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="266.8">ひとことの希望</tspan></text>
<line x1="44" y1="286.3" x2="352" y2="286.3" stroke="#FFE4E6" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="313.8">結果を確かめるのは</tspan></text>
<text font-size="19" fill="#E11D48" text-anchor="start" font-weight="700"><tspan x="44" y="341.1">だれも —</tspan><tspan x="44" y="366.2">「動いているっぽい」</tspan></text>
<line x1="44" y1="386.2" x2="352" y2="386.2" stroke="#FFE4E6" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="413.7">エラーが出たら</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="439.1">エラーを貼って祈る</tspan></text>
