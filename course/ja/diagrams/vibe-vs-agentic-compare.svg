<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="486">向いている場面</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="511.3">使い捨ての試作</tspan></text>
</g>
<g class="pulse">
<rect x="432" y="86.3" width="340" height="452.5" rx="20" fill="#ECFDF5" stroke="#059669" stroke-width="3.5"/>
<path d="M432,106.3 a20,20 0 0 1 20,-20 h300 a20,20 0 0 1 20,20 v107.7 h-340 z" fill="#059669"/>
<circle cx="602" cy="138.3" r="26" fill="#059669"/>
<circle cx="602" cy="138.3" r="23" fill="#FFFFFF" fill-opacity="0.2"/>
