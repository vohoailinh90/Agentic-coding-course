<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 641" width="800" height="641" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">バイブ型とエージェント型</title>
<desc id="desc">バイブコーディング — 渡すもの: ひとことの希望; 結果を確かめるのは: だれも —
「動いているっぽい」; エラーが出たら: エラーを貼って祈る; 向いている場面: 使い捨ての試作. エージェント型 — 渡すもの: 目標・境界・確認方法; 結果を確かめるのは: 確認方法とあなたのレビュー; エラーが出たら: 合格するまで確かめ直す; 向いている場面: だれかが頼るもの. 道具は同じ。違いは、結果をだれかが確かめるかどうかです。</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
<rect x="1" y="1" width="798" height="639" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="760" cy="36" r="90" fill="#7C3AED" fill-opacity="0.06"/>
<circle cx="46" cy="611" r="110" fill="#2563EB" fill-opacity="0.05"/>
