<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="448" y="266.8">目標・境界・確認方法</tspan></text>
<line x1="448" y1="286.3" x2="756" y2="286.3" stroke="#D1FAE5" stroke-width="2"/>
