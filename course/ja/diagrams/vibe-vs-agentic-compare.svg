<line x1="448" y1="386.2" x2="756" y2="386.2" stroke="#D1FAE5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="448" y="413.7">エラーが出たら</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="448" y="439.1">合格するまで確かめ直す</tspan></text>
<line x1="448" y1="458.5" x2="756" y2="458.5" stroke="#D1FAE5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="448" y="486">向いている場面</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="448" y="511.3">だれかが頼るもの</tspan></text>
</g>
<circle cx="400" cy="158.1" r="25" fill="#0F172A"/>
<text x="400" y="164.1" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">VS</text>
<rect x="28" y="562.8" width="744" height="49.8" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text font-size="18" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="593.8">💡 道具は同じ。違いは、結果をだれかが確かめるかどうかです。</tspan></text>
