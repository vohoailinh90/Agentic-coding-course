<title id="title">まとめ：AIエージェントは何でできている？</title>
<desc id="desc">1. 頭脳：LLM — 依頼を理解し、次の一手を選ぶ; 2. 手：ツール — ファイルの読み書きやコマンド実行——許された範囲で; 3. ループ — 考える→行動する→観察する、をくり返す; 4. 止めどきを知る — 完了したとき、またはあなたの判断が必要なとき. エージェントがどこまで自分で直せるかは、ツール・権限・受け取るフィードバックしだい。</desc>
