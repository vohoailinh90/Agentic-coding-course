進め方. 権限 — 守らせるのは: ツール; 忘れられる？: ない：毎回
チェック; 使いどころ: 許可・確認・
禁止. フック — 守らせるのは: ツール; 忘れられる？: ない：必ず
動く; 使いどころ: 止める・確かめる・
知らせる. 絶対に起きてはならないことには、指示ではなく鍵を。</desc>
