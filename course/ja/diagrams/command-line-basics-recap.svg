<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 511" width="800" height="511" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">まとめ：ターミナルはこわくない</title>
<desc id="desc">1. コマンドを打つ画面 — エージェントもここで働く; 2. いつもどこかのフォルダにいる — pwd で今いる場所がわかる; 3. 安全な5つのコマンド — pwd, ls, cd, cat, mkdir; 4. 許可する前に読む — 見るだけ？変える？どこで？; 5. わからなければ聞く — エージェントに説明してもらう. 見るだけのコマンドの打ち間違いでは壊れない。
こわいのは、読まずに削除を許可すること。</desc>
