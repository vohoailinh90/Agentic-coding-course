<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 795" width="800" height="795" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">1回のセッションの中のループ</title>
<desc id="desc">情報を集める → 行動する → 検証する. 各ステップで問う：何をした？
何を見た？次の一手は筋が通る？</desc>
<style>
