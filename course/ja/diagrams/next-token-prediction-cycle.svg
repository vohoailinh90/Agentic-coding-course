<circle cx="400" cy="128.3" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="400" y="136.6" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">👀</text>
<circle cx="320" cy="110.3" r="12" fill="#1E3A8A"/>
<text x="320" y="115.3" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text font-size="18.5" fill="#1E3A8A" text-anchor="middle" font-weight="700"><tspan x="400" y="176.8">今までの</tspan><tspan x="400" y="201.2">文章を読む</tspan></text>
<rect x="479.5" y="412" width="196" height="104.4" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
