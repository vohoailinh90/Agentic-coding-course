<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 716" width="800" height="716" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">次のトークンを予測するサイクル</title>
<desc id="desc">今までの
文章を読む → 一つ予測する → トークンを加える. 新しいトークンが、次の予測の文脈になります。</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient><marker id="arrow-cycle" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs>
<rect x="1" y="1" width="798" height="714" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="760" cy="36" r="90" fill="#7C3AED" fill-opacity="0.06"/>
<circle cx="46" cy="686" r="110" fill="#2563EB" fill-opacity="0.05"/>
<text font-size="29" fill="#0F172A" text-anchor="middle" font-weight="700"><tspan x="400" y="55">次のトークンを予測するサイクル</tspan></text>
<path d="M508.6,187.9 A205,205 0 0 1 601.2,400.8" fill="none" stroke="#D97706" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="574.6" y="254.3" width="85.5" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="617.3" y="271.8">続きを探す</tspan></text>
<path d="M520.5,527.5 A205,205 0 0 1 279.5,527.5" fill="none" stroke="#D97706" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="377.5" y="585.8" width="45" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="400" y="603.3">選ぶ</tspan></text>
<path d="M198.8,400.8 A205,205 0 0 1 291.4,187.9" fill="none" stroke="#D97706" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="133.2" y="254.3" width="99" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="182.7" y="271.8">もう一度読む</tspan></text>
<g class="pulse">
<circle cx="400" cy="361.7" r="78" fill="#D97706"/>
<circle cx="400" cy="361.7" r="70" fill="#FFFFFF" fill-opacity="0.14"/>
<text x="400" y="353.7" font-size="34" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🔁</text>
<text font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="400" y="383.7">繰り返して</tspan><tspan x="400" y="404.8">文章に</tspan></text>
</g>
<rect x="302" y="92.3" width="196" height="128.8" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
