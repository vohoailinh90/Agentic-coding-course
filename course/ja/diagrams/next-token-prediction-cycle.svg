<circle cx="577.5" cy="448" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="577.5" y="456.3" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🧩</text>
<circle cx="497.5" cy="430" r="12" fill="#4C1D95"/>
<text x="497.5" y="435" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text font-size="18.5" fill="#4C1D95" text-anchor="middle" font-weight="700"><tspan x="577.5" y="496.5">一つ予測する</tspan></text>
<rect x="124.5" y="412" width="196" height="104.4" rx="18" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<circle cx="222.5" cy="448" r="22" fill="#059669"/>
<circle cx="222.5" cy="448" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="222.5" y="456.3" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">➕</text>
<circle cx="142.5" cy="430" r="12" fill="#064E3B"/>
<text x="142.5" y="435" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text font-size="18.5" fill="#064E3B" text-anchor="middle" font-weight="700"><tspan x="222.5" y="496.5">トークンを加える</tspan></text>
<rect x="28" y="637.6" width="744" height="49.8" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text font-size="18" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="668.6">💡 新しいトークンが、次の予測の文脈になります。</tspan></text>
