<circle cx="654" cy="138.3" r="26" fill="#E11D48"/>
<circle cx="654" cy="138.3" r="23" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="654" y="148.1" font-size="27.3" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">⛔</text>
<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="654" y="191.3">一線を越える</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="552" y="241.5">例</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="552" y="266.8">会社PCのルールを変える</tspan></text>
<line x1="552" y1="308.7" x2="756" y2="308.7" stroke="#FFE4E6" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="552" y="336.2">何をする？</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="552" y="361.5">ルール違反・本物のデータ</tspan><tspan x="552" y="384">流出</tspan></text>
<line x1="552" y1="403.4" x2="756" y2="403.4" stroke="#FFE4E6" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="552" y="430.9">あなたは？</tspan></text>
<text font-size="19" fill="#E11D48" text-anchor="start" font-weight="700"><tspan x="552" y="458.2">断る</tspan></text>
</g>
<rect x="28" y="535.4" width="744" height="73.5" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text font-size="18" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="566.4">💡 わからないコマンドは許可しない。</tspan><tspan x="400" y="590.1">まず何をするのか、エージェントに聞く。</tspan></text>
</svg>
