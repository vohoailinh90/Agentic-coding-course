<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 637" width="800" height="637" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">コマンドを許可する前に</title>
<desc id="desc">見るだけ — 例: pwd, ls, cat, git status; 何をする？: 読むだけで何も変えない; あなたは？: たいてい許可. 何かを変える — 例: mkdir, mv, rm, pip install; 何をする？: 作る・移す・消す・入れる; あなたは？: 理由を聞く。ai-practice の中？. 一線を越える — 例: 会社PCのルールを変える; 何をする？: ルール違反・本物のデータ流出; あなたは？: 断る. わからないコマンドは許可しない。
まず何をするのか、エージェントに聞く。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
<rect x="1" y="1" width="798" height="635" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="760" cy="36" r="90" fill="#7C3AED" fill-opacity="0.06"/>
<circle cx="46" cy="607" r="110" fill="#2563EB" fill-opacity="0.05"/>
<text font-size="29" fill="#0F172A" text-anchor="middle" font-weight="700"><tspan x="400" y="55">コマンドを許可する前に</tspan></text>
<g>
<rect x="28" y="86.3" width="236" height="425.1" rx="20" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
<path d="M28,106.3 a20,20 0 0 1 20,-20 h196 a20,20 0 0 1 20,20 v107.7 h-236 z" fill="#059669"/>
<circle cx="146" cy="138.3" r="26" fill="#059669"/>
<circle cx="146" cy="138.3" r="23" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="146" y="148.1" font-size="27.3" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">✅</text>
<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="146" y="191.3">見るだけ</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="241.5">例</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="266.8">pwd, ls, cat, git status</tspan></text>
<line x1="44" y1="308.7" x2="248" y2="308.7" stroke="#D1FAE5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="336.2">何をする？</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="361.5">読むだけで何も変えない</tspan></text>
<line x1="44" y1="403.4" x2="248" y2="403.4" stroke="#D1FAE5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="430.9">あなたは？</tspan></text>
<text font-size="19" fill="#059669" text-anchor="start" font-weight="700"><tspan x="44" y="458.2">たいてい許可</tspan></text>
</g>
<g>
<rect x="282" y="86.3" width="236" height="425.1" rx="20" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<path d="M282,106.3 a20,20 0 0 1 20,-20 h196 a20,20 0 0 1 20,20 v107.7 h-236 z" fill="#D97706"/>
<circle cx="400" cy="138.3" r="26" fill="#D97706"/>
<circle cx="400" cy="138.3" r="23" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="400" y="148.1" font-size="27.3" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">✋</text>
<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="400" y="191.3">何かを変える</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="298" y="241.5">例</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="298" y="266.8">mkdir, mv, rm, pip</tspan><tspan x="298" y="289.3">install</tspan></text>
<line x1="298" y1="308.7" x2="502" y2="308.7" stroke="#FEF3C7" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="298" y="336.2">何をする？</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="298" y="361.5">作る・移す・消す・入れる</tspan></text>
<line x1="298" y1="403.4" x2="502" y2="403.4" stroke="#FEF3C7" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="298" y="430.9">あなたは？</tspan></text>
<text font-size="19" fill="#D97706" text-anchor="start" font-weight="700"><tspan x="298" y="458.2">理由を聞く。</tspan><tspan x="298" y="483.3">ai-practice の中？</tspan></text>
</g>
<g>
<rect x="536" y="86.3" width="236" height="425.1" rx="20" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/>
