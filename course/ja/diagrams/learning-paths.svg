<title id="title">講座の進み方を選ぶ</title>
<desc id="desc">最短ルート — 内容: ⭐ のついたレッスン; 向いているとき: 早く本物の成果がほしい; 作るもの: 自分のページ、自動レポート. 講座全体 — 内容: すべての基本レッスンを順に; 向いているとき: しっかり理解したい; 作るもの: ワークフローと自動チェックも. 必要なときに追加 — 内容: 任意と応用のユニット; 向いているとき: 興味や必要が出てきた; 作るもの: 自分のプロジェクトしだい. ゆっくりでいい。毎回、成果物と証拠があれば。</desc>
