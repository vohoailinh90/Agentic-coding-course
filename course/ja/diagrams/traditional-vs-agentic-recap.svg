<title id="title">まとめ：従来型とエージェント型</title>
<desc id="desc">1. 開発のループ — 書く・実行・
エラーを読む・直す; 2. 従来型：
あなたがループ — 1行ずつ; 3. エージェント型：
エージェントが回す — 目標を決め、証拠を確かめる; 4. 確かめる方法を渡す — ないと、ミスは
全部あなたが見つける; 5. 土台は変わらない — テスト・Git・レビュー・責任. 入力は減っても、目標はより明確に、確認はより丁寧に。</desc>
