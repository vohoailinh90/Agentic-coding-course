<title id="title">まとめ：自分のWebページ</title>
<desc id="desc">1. 言葉はあなたのもの — エージェントは形にするだけ、足さない; 2. 公開してよいことだけ — 電話・住所・個人メールは載せない; 3. 先に指示書と計画 — それから作る; 4. 確かめられる — 失敗するところを見たチェックで; 5. はじめての成果物 — 3行の証拠つき. エージェント型コーディングを、最初から最後までやり遂げた。</desc>
