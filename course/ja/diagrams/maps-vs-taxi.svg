<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 610" width="800" height="610" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">チャットボットはGoogleマップ、エージェントはタクシー</title>
<desc id="desc">チャットボット ≈ Googleマップ — あなたが伝えること: 「空港への行き方は？」; 運転するのは？: あなた; あなたの役目: 運転・道探し・渋滞への対応. AIエージェント ≈ タクシー運転手 — あなたが伝えること: 「空港まで、8時までに」; 運転するのは？: 運転手; あなたの役目: 行き先を伝え、着いた場所を確かめる. タクシーでも、到着地を確かめるのはあなたの役目。</desc>
<style>
