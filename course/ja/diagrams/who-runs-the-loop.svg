<title id="title">ループを回すのはだれ？</title>
<desc id="desc">従来型 — コードを書く: あなたが1行ずつ; 実行・エラー確認・修正: あなた; あなたの主な仕事: 入力とエラー探し; 詰まりやすいところ: 入力の速さ・文法の記憶. エージェント型 — コードを書く: エージェント; 実行・エラー確認・修正: エージェントがループで; あなたの主な仕事: 目標を伝え、証拠を確かめる; 詰まりやすいところ: あいまいな依頼・確かめる方法がない. ループを回すのはエージェント。目標を決めて確かめるのはあなたです。</desc>
