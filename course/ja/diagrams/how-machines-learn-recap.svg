<title id="title">まとめ：機械はどうやって「学ぶ」？</title>
<desc id="desc">1. 教師あり＝例＋答え — 正確で多様であることが大事; 2. 学習＝
予測・比較・調整 — 何度も繰り返す; 3. モデル＝学んだ数値 — 新しいケースを予測する; 4. 見たことのない
データで試す — 丸暗記は学習ではない; 5. LLM＝
次のトークンを予測 — 会話中にモデルは変わらない. モデルの力は学んだデータしだい。
会話の途中でモデルが変わることはない。</desc>
