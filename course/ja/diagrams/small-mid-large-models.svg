<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="552" y="511.3">Opus、Fable</tspan></text>
</g>
<rect x="28" y="562.8" width="744" height="49.8" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text font-size="18" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="593.8">💡 一番強いモデルではなく、その仕事に十分なモデルを選びましょう。</tspan></text>
