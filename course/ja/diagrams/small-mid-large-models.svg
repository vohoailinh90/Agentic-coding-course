<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 641" width="800" height="641" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">小さい・中くらい・大きいモデル</title>
<desc id="desc">小さい — 向いていること: 短くくり返す作業; 速さ: 最も速い; トークンあたりの費用: 低い; Claudeの例（2026年9月）: Haiku. 中くらい — 向いていること: 日々の仕事の大半; 速さ: 速い; トークンあたりの費用: 中くらい; Claudeの例（2026年9月）: Sonnet. 大きい — 向いていること: 難しく何段階もある仕事; 速さ: 遅め; トークンあたりの費用: 高い; Claudeの例（2026年9月）: Opus、Fable. 一番強いモデルではなく、その仕事に十分なモデルを選びましょう。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
<rect x="1" y="1" width="798" height="639" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="760" cy="36" r="90" fill="#7C3AED" fill-opacity="0.06"/>
<circle cx="46" cy="611" r="110" fill="#2563EB" fill-opacity="0.05"/>
<text font-size="29" fill="#0F172A" text-anchor="middle" font-weight="700"><tspan x="400" y="55">小さい・中くらい・大きいモデル</tspan></text>
<g>
<rect x="28" y="86.3" width="236" height="452.5" rx="20" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<path d="M28,106.3 a20,20 0 0 1 20,-20 h196 a20,20 0 0 1 20,20 v107.7 h-236 z" fill="#2563EB"/>
<circle cx="146" cy="138.3" r="26" fill="#2563EB"/>
<circle cx="146" cy="138.3" r="23" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="146" y="148.1" font-size="27.3" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">⚡</text>
<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="146" y="191.3">小さい</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="241.5">向いていること</tspan></text>
<text font-size="19" fill="#2563EB" text-anchor="start" font-weight="700"><tspan x="44" y="268.8">短くくり返す作業</tspan></text>
<line x1="44" y1="314" x2="248" y2="314" stroke="#DBEAFE" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="341.5">速さ</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="366.8">最も速い</tspan></text>
<line x1="44" y1="386.2" x2="248" y2="386.2" stroke="#DBEAFE" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="413.7">トークンあたりの費用</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="439.1">低い</tspan></text>
<line x1="44" y1="458.5" x2="248" y2="458.5" stroke="#DBEAFE" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="486">Claudeの例（2026年9月）</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="511.3">Haiku</tspan></text>
</g>
<g>
