<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 614" width="800" height="614" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">指示ファイル・メモリ・スキル</title>
<desc id="desc">指示ファイル — 書くのは: あなた; 読みこむとき: 毎セッション; 使いどころ: どの作業にも
当てはまる規則. 自動メモリ — 書くのは: エージェント; 読みこむとき: 毎セッション
（先頭部分）; 使いどころ: あなたの訂正から
学んだこと. スキル — 書くのは: あなた
（または導入）; 読みこむとき: 必要なとき
だけ; 使いどころ: 何段階もの
手順. 規則はいつも、手順は必要なときに、メモリは読み直す。</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
