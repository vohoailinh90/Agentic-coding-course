<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 691" width="800" height="691" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">エージェントで練習する3つの方法</title>
<desc id="desc">個人のPC — インストール: エージェントのアプリ; ファイルの置き場所: 自分のPCの中; 向いているとき: 自分のPCがある; 注意: ai-practiceの中だけで作業. ブラウザ（クラウド） — インストール: 不要; ファイルの置き場所: ネット上のリポジトリ; 向いているとき: ソフトを入れられない; 注意: GitHubアカウントが必要. 会社のPC — インストール: 許可されたツールだけ; ファイルの置き場所: 会社のルールどおり; 向いているとき: 会社が許可している; 注意: 練習は架空のデータで. 許可があるか分からないなら、まず確認。または個人のPCで学ぶ。</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
