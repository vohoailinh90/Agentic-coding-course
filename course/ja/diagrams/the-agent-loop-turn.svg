<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 743" width="800" height="743" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">エージェントのループの1ターン</title>
<desc id="desc">コンテキスト
を読む → ツールを選ぶ → ツールが動く → 結果が戻る. 結果のひとつひとつが次の一手を決めます。</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient><marker id="arrow-cycle" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker></defs>
<rect x="1" y="1" width="798" height="741" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="760" cy="36" r="90" fill="#7C3AED" fill-opacity="0.06"/>
<circle cx="46" cy="713" r="110" fill="#2563EB" fill-opacity="0.05"/>
<text font-size="29" fill="#0F172A" text-anchor="middle" font-weight="700"><tspan x="400" y="55">エージェントのループの1ターン</tspan></text>
<text font-size="17" fill="#475569" text-anchor="middle"><tspan x="400" y="85.3">確認に合格するか、あなたが必要か、行き詰まるまで</tspan></text>
<path d="M509,229.4 A190,190 0 0 1 574.9,310.8" fill="none" stroke="#059669" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="543.3" y="232.4" width="58.5" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="572.5" y="249.9">決める</tspan></text>
<path d="M574.9,459.3 A190,190 0 0 1 509,540.7" fill="none" stroke="#059669" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="536.5" y="511.8" width="72" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="572.5" y="529.3">依頼する</tspan></text>
<path d="M291,540.7 A190,190 0 0 1 225.1,459.3" fill="none" stroke="#059669" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="205" y="511.8" width="45" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="227.5" y="529.3">返す</tspan></text>
<path d="M225.1,310.8 A190,190 0 0 1 291,229.4" fill="none" stroke="#059669" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="184.7" y="232.4" width="85.5" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="227.5" y="249.9">次のターン</tspan></text>
<g class="pulse">
<circle cx="400" cy="385" r="78" fill="#059669"/>
<circle cx="400" cy="385" r="70" fill="#FFFFFF" fill-opacity="0.14"/>
<text x="400" y="377" font-size="34" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🤖</text>
<text font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="400" y="407">エージェント</tspan></text>
</g>
<rect x="302" y="118.7" width="196" height="152.6" rx="18" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<circle cx="400" cy="154.7" r="22" fill="#4F46E5"/>
<circle cx="400" cy="154.7" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="400" y="163" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">📖</text>
<circle cx="320" cy="136.7" r="12" fill="#312E81"/>
<text x="320" y="141.7" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text font-size="18.5" fill="#312E81" text-anchor="middle" font-weight="700"><tspan x="400" y="203.2">コンテキスト</tspan><tspan x="400" y="227.6">を読む</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="400" y="252.6">依頼・ファイル・結果</tspan></text>
<rect x="492" y="320.9" width="196" height="128.2" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<circle cx="590" cy="356.9" r="22" fill="#7C3AED"/>
<circle cx="590" cy="356.9" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="590" y="365.2" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">👉</text>
<circle cx="510" cy="338.9" r="12" fill="#4C1D95"/>
<text x="510" y="343.9" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text font-size="18.5" fill="#4C1D95" text-anchor="middle" font-weight="700"><tspan x="590" y="405.4">ツールを選ぶ</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="590" y="430.3">読む・実行・検索・編集</tspan></text>
<rect x="302" y="510.9" width="196" height="128.2" rx="18" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
<circle cx="400" cy="546.9" r="22" fill="#D97706"/>
<circle cx="400" cy="546.9" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="400" y="555.2" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🔧</text>
<circle cx="320" cy="528.9" r="12" fill="#78350F"/>
<text x="320" y="533.9" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text font-size="18.5" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="595.4">ツールが動く</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="400" y="620.3">または先に確認</tspan></text>
<rect x="112" y="320.9" width="196" height="128.2" rx="18" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
<circle cx="210" cy="356.9" r="22" fill="#0D9488"/>
<circle cx="210" cy="356.9" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="210" y="365.2" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">📥</text>
<circle cx="130" cy="338.9" r="12" fill="#134E4A"/>
<text x="130" y="343.9" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text font-size="18.5" fill="#134E4A" text-anchor="middle" font-weight="700"><tspan x="210" y="405.4">結果が戻る</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="210" y="430.4">コンテキストに入る</tspan></text>
<rect x="28" y="665.1" width="744" height="49.8" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text font-size="18" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="696.1">💡 結果のひとつひとつが次の一手を決めます。</tspan></text>
</svg>
