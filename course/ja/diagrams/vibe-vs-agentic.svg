<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 616" width="800" height="616" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">バイブ型？エージェント型？</title>
<desc id="desc">バイブコーディング — 変更を読む？: 読まない; 完了の判断: 動いているように見える; エラーが出たら: AIに貼って直してもらう; 向いていること: 捨ててよい試作. エージェント型 — 変更を読む？: 読む; 完了の判断: 先に決めた基準をすべて満たす; エラーが出たら: 原因を探し、確かめ直す; 向いていること: だれかが頼りにする仕事. 違いは道具ではなく、結果をどう扱うかです。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
