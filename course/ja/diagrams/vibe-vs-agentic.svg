<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="458.3">向いていること</tspan></text>
<text font-size="19" fill="#EA580C" text-anchor="start" font-weight="700"><tspan x="44" y="485.6">捨ててよい試作</tspan></text>
