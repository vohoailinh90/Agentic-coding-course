＝モデルを変える — データと手間がかかる; 4. 情報が変わったら — 再学習せず資料を更新; 5. 組み合わせられる — プロンプト＋RAGで
足りることが多い. まず指示、次に資料。モデルを変えるのは最後。</desc>
