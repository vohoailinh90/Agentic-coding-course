<title id="title">まとめ：コンテキストエンジニアリング</title>
<desc id="desc">1. 限りある資源 — 多すぎても
足りなくても困る; 2. いつも：
短い指示ファイル — どのセッションにも
当てはまることだけ; 3. 必要なとき：
パスを渡す — 作業に必要なときに
読ませる; 4. 入れない — 無関係・巨大・
秘密・本物のデータ; 5. 削って試す — 消したら
ミスが出る？. 少なく、正しく、よいタイミングで。</desc>
