<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 503" width="800" height="503" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">証拠のまとめの5つの部分</title>
<desc id="desc">1. 依頼内容 — 目標と
完了条件; 2. 前と後 — 以前のやり方と
今のコマンド; 3. 確認 — 何を実行し、結果は、
わざと壊した結果; 4. 限界 — 使わないほうが
いい場面; 5. 改善を1つ — 次に変える
ことを1つ. その場にいなかった人でも、再実行して確かめられるように。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
