<circle cx="654" cy="138.3" r="26" fill="#059669"/>
<circle cx="654" cy="138.3" r="23" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="654" y="148.1" font-size="27.3" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">📝</text>
<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="654" y="191.3">保存したファイル</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="552" y="241.5">中身</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="552" y="266.8">指示書・メモ・決まりごと</tspan></text>
<line x1="552" y1="308.7" x2="756" y2="308.7" stroke="#D1FAE5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="552" y="336.2">どれだけ続く</tspan></text>
<text font-size="19" fill="#059669" text-anchor="start" font-weight="700"><tspan x="552" y="363.5">セッションをまたい</tspan><tspan x="552" y="388.6">で残る</tspan></text>
<line x1="552" y1="433.8" x2="756" y2="433.8" stroke="#D1FAE5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="552" y="461.3">あなたがすること</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="552" y="486.6">大事なことはファイルに書</tspan><tspan x="552" y="509">く</tspan></text>
</g>
<rect x="28" y="560.5" width="744" height="49.8" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text font-size="18" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="591.5">💡 長く覚えておくべきことは、会話だけでなくファイルに書く。</tspan></text>
