<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="146" y="191.3">学習した知識</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="241.5">中身</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="266.8">学習で身につけたこと</tspan></text>
<line x1="44" y1="308.7" x2="248" y2="308.7" stroke="#E2E8F0" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="336.2">どれだけ続く</tspan></text>
<text font-size="19" fill="#475569" text-anchor="start" font-weight="700"><tspan x="44" y="363.5">ある時点で止まり、</tspan><tspan x="44" y="388.6">古いことも</tspan></text>
<line x1="44" y1="433.8" x2="248" y2="433.8" stroke="#E2E8F0" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="461.3">あなたがすること</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="486.6">新しい情報は渡す</tspan></text>
