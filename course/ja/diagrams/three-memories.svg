<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="298" y="241.5">中身</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="298" y="266.8">メッセージ・読んだ</tspan><tspan x="298" y="289.3">ファイル・実行結果</tspan></text>
<line x1="298" y1="308.7" x2="502" y2="308.7" stroke="#DBEAFE" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="298" y="336.2">どれだけ続く</tspan></text>
<text font-size="19" fill="#2563EB" text-anchor="start" font-weight="700"><tspan x="298" y="363.5">このセッションだ</tspan><tspan x="298" y="388.6">け。満杯で質が落ち</tspan><tspan x="298" y="413.7">る</tspan></text>
<line x1="298" y1="433.8" x2="502" y2="433.8" stroke="#DBEAFE" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="298" y="461.3">あなたがすること</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="298" y="486.6">1つの作業に1セッション</tspan></text>
</g>
<g>
<rect x="536" y="86.3" width="236" height="450.2" rx="20" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
