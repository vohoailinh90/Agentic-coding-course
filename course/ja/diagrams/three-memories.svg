<rect x="28" y="86.3" width="236" height="450.2" rx="20" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
<path d="M28,106.3 a20,20 0 0 1 20,-20 h196 a20,20 0 0 1 20,20 v107.7 h-236 z" fill="#475569"/>
