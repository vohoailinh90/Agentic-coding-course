<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 639" width="800" height="639" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">エージェントはどこで「覚えている」？</title>
<desc id="desc">学習した知識 — 中身: 学習で身につけたこと; どれだけ続く: ある時点で止まり、古いことも; あなたがすること: 新しい情報は渡す. コンテキスト — 中身: メッセージ・読んだファイル・実行結果; どれだけ続く: このセッションだけ。満杯で質が落ちる; あなたがすること: 1つの作業に1セッション. 保存したファイル — 中身: 指示書・メモ・決まりごと; どれだけ続く: セッションをまたいで残る; あなたがすること: 大事なことはファイルに書く. 長く覚えておくべきことは、会話だけでなくファイルに書く。</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
<rect x="1" y="1" width="798" height="637" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="760" cy="36" r="90" fill="#7C3AED" fill-opacity="0.06"/>
<circle cx="46" cy="609" r="110" fill="#2563EB" fill-opacity="0.05"/>
