<circle cx="400" cy="138.3" r="26" fill="#2563EB"/>
<circle cx="400" cy="138.3" r="23" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="400" y="148.1" font-size="27.3" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🪟</text>
