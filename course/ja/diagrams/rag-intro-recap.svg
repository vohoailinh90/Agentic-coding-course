<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 483" width="800" height="483" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">まとめ：RAG</title>
<desc id="desc">1. 検索する — 質問に合う箇所を探す; 2. 追加する — 抜粋をプロンプトに入れる; 3. 回答する — 抜粋にもとづき出典つきで; 4. モデルは覚えない — この回答だけに使う; 5. 出典を確かめる — 古い資料や検索ミスで
自信満々に間違う. 自分の資料について聞くなら、AIに調べさせ、出典は自分で確かめる。</desc>
