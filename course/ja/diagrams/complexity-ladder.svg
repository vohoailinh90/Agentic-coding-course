<circle cx="400" cy="517.2" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="400" y="525.5" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🤖</text>
<circle cx="106" cy="499.2" r="12" fill="#064E3B"/>
<text x="106" y="504.2" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text font-size="18.5" fill="#064E3B" text-anchor="middle" font-weight="700"><tspan x="400" y="565.7">ひとつのエージェント</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="400" y="590.6">見つけたことから手順を選ぶ</tspan></text>
<line x1="400.0" y1="613.4" x2="400.0" y2="659.4" stroke="#475569" stroke-width="3" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-flow)"/>
<rect x="447" y="624.5" width="126" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="510" y="642">はっきりした理由</tspan></text>
<rect x="88" y="665.4" width="624" height="148" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<circle cx="400" cy="701.4" r="22" fill="#7C3AED"/>
<circle cx="400" cy="701.4" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="400" y="709.7" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🧑‍🤝‍🧑</text>
<circle cx="106" cy="683.4" r="12" fill="#4C1D95"/>
<text x="106" y="688.4" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text font-size="18.5" fill="#4C1D95" text-anchor="middle" font-weight="700"><tspan x="400" y="749.9">エージェント＋サブエージェント</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="400" y="774.8">コンテキストがあふれる・</tspan><tspan x="400" y="794.6">新しい目・並行作業</tspan></text>
<rect x="28" y="837.4" width="744" height="49.8" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text font-size="18" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="868.4">💡 上るほど高くつく。流行りではなく、必要だから上る。</tspan></text>
</svg>
