<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 532" width="800" height="532" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">まとめ：練習環境を選ぶ</title>
<desc id="desc">1. 基本は個人のPC — エージェントのアプリとai-practice; 2. ブラウザ：インストール不要 — ファイルはネット上のリポジトリに; 3. 会社のPC：まず確認 — 勝手に入れない、ルールを回避しない; 4. ai-practiceフォルダを1つ — すべての練習を架空のデータで; 5. 準備がまだなら、まず見る — 作業ログを読んで予想する. 自分のPCとルールに合う方法を選んで、始めよう。</desc>
