<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1080" width="800" height="1080" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">パスを読む：ルートからファイルまで</title>
<desc id="desc">ルート（ドライブ） → ユーザーのフォルダ → Documents（書類） → ai-practice → my-week.html. パスは住所。読めれば、ファイルが境界の内か外かがわかる。</desc>
<style>
