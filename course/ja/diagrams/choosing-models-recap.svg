<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 507" width="800" height="507" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">まとめ：モデルの選び方</title>
<desc id="desc">1. 3つのトレードオフ — 能力・速さ・費用; 2. 簡単な仕事は
小さいモデル — 短い・くり返し・確かめやすい; 3. 難しい仕事は
大きいモデル — 何段階もあり、
間違いが高くつく; 4. 先に努力レベルを調整 — モデルを変える前に; 5. 実際の仕事で試す — 2つのモデル、同じ基準. 仕事に合わせて選び、実際の結果で確かめましょう。</desc>
