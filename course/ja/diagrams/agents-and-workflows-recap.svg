<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 551" width="800" height="551" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">まとめ：エージェントとワークフロー</title>
<desc id="desc">1. ワークフロー：
決まった手順 — 読みやすく安定; 2. エージェント：
手順を自分で選ぶ — 先が読めないときに
柔軟; 3. シンプルに始める — 下の段で足りない
ときだけ上る; 4. サブエージェントは
理由があるとき — あふれる文脈・
新しい目・並行作業; 5. エージェントには代償 — 費用・ふつうは会話なし・
失敗の場所が増える. まずシンプルに。はっきりした理由があるときにエージェントを足す。</desc>
