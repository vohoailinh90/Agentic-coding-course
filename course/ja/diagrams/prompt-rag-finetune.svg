<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 690" width="800" height="690" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">3つの方法は、何を変える？</title>
<desc id="desc">プロンプト — 変えるもの: 伝える指示; 向いていること: 手順・形式・口調; 手間: いちばん少ない; 情報が変わったら: プロンプトを直す. RAG — 変えるもの: 読ませる資料; 向いていること: 社内の・変わる情報; 手間: 中くらい：資料と検索; 情報が変わったら: 資料を更新する. ファイン
チューニング — 変えるもの: モデルそのもの; 向いていること: 決まった文体や技能; 手間: いちばん多い：
データと学習; 情報が変わったら: 学習し直す. プロンプト→RAG→ファインチューニングの順に試し、
十分ならそこで止める。</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
