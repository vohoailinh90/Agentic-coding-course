<title id="title">リスクに合わせて型を足す</title>
<desc id="desc">そのまま — 使う場面: ひとことで
言える変更; 防ぐリスク: ムダな手順; 追加の手間: ほぼなし. 先に計画 — 使う場面: やり方が不明
ファイル多数; 防ぐリスク: 問題を
取りちがえる; 追加の手間: 数分の読む時間. テスト先行 — 使う場面: 正解が先にわかる; 防ぐリスク: 「たぶん
合っている」; 追加の手間: ケースを
いくつか書く. 別にレビュー — 使う場面: ミスが
高くつく; 防ぐリスク: 作り手の
見落とし; 追加の手間: 新しいセッション1つ. 「どこで失敗しうる？」と問い、必要なものだけを足します。</desc>
