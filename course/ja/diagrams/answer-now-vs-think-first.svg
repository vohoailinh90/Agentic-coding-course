<title id="title">すぐ答える？先に考える？</title>
<desc id="desc">すぐ答える — やり方: そのまま答えを書く; 時間: 速い; トークン: 答えの分だけ; 向いていること: 短い質問・言い換え. 先に考える — やり方: 手順を下書きしてから答える; 時間: 時間がかかる; トークン: 考える分も加わる; 向いていること: 何段階もある問題・コード・計画. 先に考えると、複雑な問題に強くなります。
ただし、時間とトークンがかかります。</desc>
