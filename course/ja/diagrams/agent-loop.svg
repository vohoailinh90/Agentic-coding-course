<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 752" width="800" height="752" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">エージェントのループ</title>
<desc id="desc">考える → 行動する → 観察する. 目標を決め、最後の結果を確かめるのはあなた。</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient><marker id="arrow-cycle" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker></defs>
<rect x="1" y="1" width="798" height="750" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="760" cy="36" r="90" fill="#7C3AED" fill-opacity="0.06"/>
<circle cx="46" cy="722" r="110" fill="#2563EB" fill-opacity="0.05"/>
<text font-size="29" fill="#0F172A" text-anchor="middle" font-weight="700"><tspan x="400" y="55">エージェントのループ</tspan></text>
<text font-size="17" fill="#475569" text-anchor="middle"><tspan x="400" y="85.3">目標を達成するか、あなたへの確認が必要になるまで繰り返す</tspan></text>
<path d="M508.2,212.8 A210,210 0 0 1 608,422.1" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="568.9" y="275.7" width="99" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="618.4" y="293.2">ツールを選ぶ</tspan></text>
<path d="M508.2,572.8 A210,210 0 0 1 291.8,572.8" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="343.7" y="621.9" width="112.5" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="400" y="639.4">結果を受け取る</tspan></text>
<path d="M192,422.1 A210,210 0 0 1 291.8,212.8" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="125.3" y="275.7" width="112.5" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="181.6" y="293.2">未完了なら次へ</tspan></text>
<g class="pulse">
<circle cx="400" cy="392.8" r="78" fill="#4F46E5"/>
<circle cx="400" cy="392.8" r="70" fill="#FFFFFF" fill-opacity="0.14"/>
<text x="400" y="384.8" font-size="34" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🤖</text>
<text font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="400" y="414.8">AIエージェント</tspan></text>
</g>
<rect x="302" y="118.7" width="196" height="128.2" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<circle cx="400" cy="154.7" r="22" fill="#7C3AED"/>
<circle cx="400" cy="154.7" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="400" y="163" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🧠</text>
<circle cx="320" cy="136.7" r="12" fill="#4C1D95"/>
<text x="320" y="141.7" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text font-size="18.5" fill="#4C1D95" text-anchor="middle" font-weight="700"><tspan x="400" y="203.2">考える</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="400" y="228.1">次の一手は？</tspan></text>
<rect x="483.9" y="433.7" width="196" height="128.2" rx="18" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
<circle cx="581.9" cy="469.7" r="22" fill="#D97706"/>
<circle cx="581.9" cy="469.7" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="581.9" y="478" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🔧</text>
<circle cx="501.9" cy="451.7" r="12" fill="#78350F"/>
<text x="501.9" y="456.7" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text font-size="18.5" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="581.9" y="518.2">行動する</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="581.9" y="543.1">実際にツールを使う</tspan></text>
<rect x="120.1" y="433.7" width="196" height="128.2" rx="18" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
<circle cx="218.1" cy="469.7" r="22" fill="#0D9488"/>
<circle cx="218.1" cy="469.7" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="218.1" y="478" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">👀</text>
<circle cx="138.1" cy="451.7" r="12" fill="#134E4A"/>
<text x="138.1" y="456.7" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text font-size="18.5" fill="#134E4A" text-anchor="middle" font-weight="700"><tspan x="218.1" y="518.2">観察する</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="218.1" y="543.1">うまくいった？</tspan></text>
<rect x="28" y="673.7" width="744" height="49.8" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text font-size="18" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="704.7">💡 目標を決め、最後の結果を確かめるのはあなた。</tspan></text>
</svg>
