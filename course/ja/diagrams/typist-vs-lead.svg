<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 616" width="800" height="616" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">タイピストとリーダー</title>
<desc id="desc">タイピスト — 時間を使うのは: 1行ずつ入力する; あなたの問い: どう書けばいい？; バグが出たら: 1行ずつ探す; 責任を持つのは: 動くコード. リーダー — 時間を使うのは: 目標を明確にし、確かめる; あなたの問い: 何をもって完了？; バグが出たら: 説明し、任せ、確かめ直す; 責任を持つのは: 正しく安全な結果. 入力はエージェントに。決めることと確かめることはあなたに。</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
