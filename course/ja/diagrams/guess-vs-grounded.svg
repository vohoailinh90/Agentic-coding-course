<circle cx="602" cy="138.3" r="26" fill="#059669"/>
<circle cx="602" cy="138.3" r="23" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="602" y="148.1" font-size="27.3" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">📚</text>
<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="602" y="191.3">根拠のある答え</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="448" y="241.5">よりどころ</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="448" y="266.8">渡した資料、実際の実行結果</tspan></text>
