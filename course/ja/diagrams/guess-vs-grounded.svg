<circle cx="46" cy="514" r="110" fill="#2563EB" fill-opacity="0.05"/>
<text font-size="29" fill="#0F172A" text-anchor="middle" font-weight="700"><tspan x="400" y="55">もっともらしい推測か、根拠のある答えか</tspan></text>
<g>
<rect x="28" y="86.3" width="340" height="355.1" rx="20" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/>
<path d="M28,106.3 a20,20 0 0 1 20,-20 h300 a20,20 0 0 1 20,20 v107.7 h-340 z" fill="#E11D48"/>
<circle cx="198" cy="138.3" r="26" fill="#E11D48"/>
<circle cx="198" cy="138.3" r="23" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="198" y="148.1" font-size="27.3" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🎲</text>
<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="198" y="191.3">もっともらしい推測</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="241.5">よりどころ</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="266.8">モデルが学習したパターン</tspan></text>
<line x1="44" y1="286.3" x2="352" y2="286.3" stroke="#FFE4E6" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="313.8">口調</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="339.1">自信たっぷり</tspan></text>
<line x1="44" y1="358.5" x2="352" y2="358.5" stroke="#FFE4E6" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="386">確かめられる？</tspan></text>
<text font-size="19" fill="#E11D48" text-anchor="start" font-weight="700"><tspan x="44" y="413.3">できない――根拠がない</tspan></text>
</g>
<g class="pulse">
