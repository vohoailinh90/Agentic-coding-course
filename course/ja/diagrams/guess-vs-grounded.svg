<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="448" y="339.1">自信たっぷり</tspan></text>
<line x1="448" y1="358.5" x2="756" y2="358.5" stroke="#D1FAE5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="448" y="386">確かめられる？</tspan></text>
<text font-size="19" fill="#059669" text-anchor="start" font-weight="700"><tspan x="448" y="413.3">できる――引用、再実行</tspan></text>
