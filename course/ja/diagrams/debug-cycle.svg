<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 682" width="800" height="682" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">探偵のようにデバッグする</title>
<desc id="desc">再現する → メッセージを読む → 原因を推理する → 1か所だけ直す → 検証する</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient><marker id="arrow-cycle" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker></defs>
<rect x="1" y="1" width="798" height="680" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="760" cy="36" r="90" fill="#7C3AED" fill-opacity="0.06"/>
<circle cx="46" cy="652" r="110" fill="#2563EB" fill-opacity="0.05"/>
<text font-size="29" fill="#0F172A" text-anchor="middle" font-weight="700"><tspan x="400" y="55">探偵のようにデバッグする</tspan></text>
<text font-size="17" fill="#475569" text-anchor="middle"><tspan x="400" y="85.3">一周に手がかり1つ、変更は一度に1つ</tspan></text>
<path d="M496.2,216.7 A205,205 0 0 1 539.8,247.8" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="508.4" y="191.9" width="58.5" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="537.6" y="209.4">見える</tspan></text>
<path d="M603.5,422.7 A205,205 0 0 1 584.3,487.6" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="591.2" y="452.1" width="72" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="627.2" y="469.6">手がかり</tspan></text>
<path d="M425,601.2 A205,205 0 0 1 375,601.2" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="377.5" y="621.8" width="45" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="400" y="639.3">試す</tspan></text>
<path d="M215.7,487.6 A205,205 0 0 1 196.1,419.2" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="115.9" y="450.1" width="112.5" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="172.2" y="467.6">もう一度動かす</tspan></text>
<path d="M257.6,250.3 A205,205 0 0 1 303.8,216.7" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="156" y="154.3" width="153" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="232.5" y="171.8">直らなければもう一周</tspan></text>
<g class="pulse">
<circle cx="400" cy="397.7" r="78" fill="#4F46E5"/>
<circle cx="400" cy="397.7" r="70" fill="#FFFFFF" fill-opacity="0.14"/>
<text x="400" y="389.7" font-size="34" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🔎</text>
<text font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="400" y="419.7">あなたと</tspan><tspan x="400" y="440.9">エージェント</tspan></text>
</g>
<rect x="315" y="118.7" width="170" height="148" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<circle cx="400" cy="154.7" r="22" fill="#2563EB"/>
<circle cx="400" cy="154.7" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="400" y="163" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🔁</text>
<circle cx="333" cy="136.7" r="12" fill="#1E3A8A"/>
<text x="333" y="141.7" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text font-size="18.5" fill="#1E3A8A" text-anchor="middle" font-weight="700"><tspan x="400" y="203.2">再現する</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="400" y="228.1">わざともう一度起こ</tspan><tspan x="400" y="247.9">す</tspan></text>
<rect x="510" y="258.1" width="170" height="152.6" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<circle cx="595" cy="294.1" r="22" fill="#7C3AED"/>
<circle cx="595" cy="294.1" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="595" y="302.4" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">📜</text>
<circle cx="528" cy="276.1" r="12" fill="#4C1D95"/>
<text x="528" y="281.1" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text font-size="18.5" fill="#4C1D95" text-anchor="middle" font-weight="700"><tspan x="595" y="342.6">メッセージを読</tspan><tspan x="595" y="367">む</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="595" y="391.9">何が、どこで</tspan></text>
<rect x="435.5" y="499.5" width="170" height="128.2" rx="18" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
<circle cx="520.5" cy="535.5" r="22" fill="#D97706"/>
<circle cx="520.5" cy="535.5" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="520.5" y="543.8" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">💡</text>
<circle cx="453.5" cy="517.5" r="12" fill="#78350F"/>
<text x="453.5" y="522.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text font-size="18.5" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="520.5" y="584">原因を推理する</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="520.5" y="608.9">仮説を1つ</tspan></text>
<rect x="194.5" y="499.5" width="170" height="128.2" rx="18" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
<circle cx="279.5" cy="535.5" r="22" fill="#EA580C"/>
<circle cx="279.5" cy="535.5" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="279.5" y="543.8" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🔧</text>
<circle cx="212.5" cy="517.5" r="12" fill="#7C2D12"/>
<text x="212.5" y="522.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text font-size="18.5" fill="#7C2D12" text-anchor="middle" font-weight="700"><tspan x="279.5" y="584">1か所だけ直す</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="279.5" y="608.9">変更は一度に1つ</tspan></text>
<rect x="120" y="260.4" width="170" height="148" rx="18" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<circle cx="205" cy="296.4" r="22" fill="#059669"/>
<circle cx="205" cy="296.4" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="205" y="304.7" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">✅</text>
<circle cx="138" cy="278.4" r="12" fill="#064E3B"/>
<text x="138" y="283.4" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text font-size="18.5" fill="#064E3B" text-anchor="middle" font-weight="700"><tspan x="205" y="344.9">検証する</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="205" y="369.8">直ったらチェックを</tspan><tspan x="205" y="389.6">追加</tspan></text>
</svg>
