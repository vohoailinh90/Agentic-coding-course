<circle cx="590" cy="334.8" r="22" fill="#7C3AED"/>
<circle cx="590" cy="334.8" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="590" y="343.1" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🗺️</text>
<circle cx="510" cy="316.8" r="12" fill="#4C1D95"/>
