<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="567.5" y="231.8">理解した</tspan></text>
<path d="M569.3,459.1 A190,190 0 0 1 509,528.5" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="524.8" y="505.6" width="85.5" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="567.5" y="523.1">計画を承認</tspan></text>
<path d="M291,528.5 A190,190 0 0 1 225.1,447.1" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="184.7" y="499.6" width="85.5" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="227.5" y="517.1">一部が完成</tspan></text>
<path d="M225.1,298.6 A190,190 0 0 1 291,217.2" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="128.7" y="198.7" width="166.5" height="43.6" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="211.9" y="216.2">新しい発見があれば、ま</tspan><tspan x="211.9" y="234">た調べる</tspan></text>
<g class="pulse">
<circle cx="400" cy="372.8" r="78" fill="#4F46E5"/>
<circle cx="400" cy="372.8" r="70" fill="#FFFFFF" fill-opacity="0.14"/>
<text x="400" y="364.8" font-size="34" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">👤</text>
<text font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="400" y="394.8">あなたが承認</tspan></text>
</g>
