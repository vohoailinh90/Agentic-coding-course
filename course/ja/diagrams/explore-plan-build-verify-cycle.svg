<circle cx="210" cy="344.7" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="210" y="353" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">✅</text>
<circle cx="130" cy="326.7" r="12" fill="#064E3B"/>
<text x="130" y="331.7" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text font-size="18.5" fill="#064E3B" text-anchor="middle" font-weight="700"><tspan x="210" y="393.2">検証する</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="210" y="418.1">完了条件と比べる</tspan></text>
