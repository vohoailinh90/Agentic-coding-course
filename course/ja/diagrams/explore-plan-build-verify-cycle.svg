<text font-size="18.5" fill="#4C1D95" text-anchor="middle" font-weight="700"><tspan x="590" y="383.3">計画する</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="590" y="408.2">何を・どこで・どう確か</tspan><tspan x="590" y="428">める</tspan></text>
<rect x="302" y="498.7" width="196" height="128.2" rx="18" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
