<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 591" width="800" height="591" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" lang="ja">
<title id="title">同じデータの3つの書き方</title>
<desc id="desc">CSV — 見た目: 表。列はカンマ区切り; 向いている用途: 表計算、Excel; つまずきやすい点: セルの中のカンマ. JSON — 見た目: 波かっこの中に名前と値; 向いている用途: プログラム同士のやり取り; つまずきやすい点: 記号が1つ欠けると壊れる. YAML — 見た目: インデントとコロン; 向いている用途: 人が書く設定ファイル; つまずきやすい点: インデントがずれると壊れる. 読むのは人か、表計算か、プログラムか。それで形式を選ぶ。</desc>
