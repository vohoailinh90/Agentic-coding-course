<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 527" width="800" height="527" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Tóm tắt: gỡ lỗi như một thám tử</title>
<desc id="desc">1. Tái hiện trước — Biết cách làm lỗi xảy ra lại; 2. Đọc dòng cuối trước — Lỗi gì, ở file nào, dòng nào; 3. Dán nguyên văn — Kèm việc đã làm và điều mong đợi; 4. Mỗi lần một thay đổi — Để biết cái gì đã sửa được lỗi; 5. Hai lần hỏng thì làm lại — Bắt đầu lại với yêu cầu tốt hơn. Sửa xong, thêm một phép kiểm tra để lỗi không quay lại.</desc>
