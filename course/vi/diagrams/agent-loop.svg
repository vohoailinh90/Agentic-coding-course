<circle cx="560.2" cy="432.2" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="560.2" y="440.5" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🔧</text>
<circle cx="480.2" cy="414.2" r="12" fill="#78350F"/>
<text x="480.2" y="419.2" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text font-size="18.5" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="560.2" y="480.7">Hành động</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="560.2" y="505.6">dùng một công cụ thật</tspan></text>
<rect x="141.8" y="396.2" width="196" height="128.2" rx="18" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
<circle cx="239.8" cy="432.2" r="22" fill="#0D9488"/>
<circle cx="239.8" cy="432.2" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="239.8" y="440.5" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">👀</text>
<circle cx="159.8" cy="414.2" r="12" fill="#134E4A"/>
<text x="159.8" y="419.2" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text font-size="18.5" fill="#134E4A" text-anchor="middle" font-weight="700"><tspan x="239.8" y="480.7">Quan sát</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="239.8" y="505.6">kết quả đã đúng chưa?</tspan></text>
<rect x="28" y="632.8" width="744" height="49.8" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text font-size="18" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="663.8">💡 Bạn đặt mục tiêu và kiểm tra kết quả cuối cùng.</tspan></text>
</svg>
