<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 711" width="800" height="711" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Vòng lặp của một AI agent</title>
<desc id="desc">Suy nghĩ → Hành động → Quan sát. Bạn đặt mục tiêu và kiểm tra kết quả cuối cùng.</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient><marker id="arrow-cycle" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker></defs>
<rect x="1" y="1" width="798" height="709" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="760" cy="36" r="90" fill="#7C3AED" fill-opacity="0.06"/>
<circle cx="46" cy="681" r="110" fill="#2563EB" fill-opacity="0.05"/>
<text font-size="29" fill="#0F172A" text-anchor="middle" font-weight="700"><tspan x="400" y="55">Vòng lặp của một AI agent</tspan></text>
<text font-size="17" fill="#475569" text-anchor="middle"><tspan x="400" y="85.3">Lặp lại cho đến khi đạt mục tiêu — hoặc cần hỏi ý bạn</tspan></text>
<path d="M508.7,218.2 A185,185 0 0 1 584.3,384" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="547.1" y="264.1" width="104.4" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="599.3" y="281.6">chọn công cụ</tspan></text>
<path d="M478.2,535.5 A185,185 0 0 1 321.8,535.5" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="347.8" y="573.9" width="104.4" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="400" y="591.4">nhận kết quả</tspan></text>
<path d="M215.7,384 A185,185 0 0 1 291.3,218.2" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="119.4" y="264.1" width="162.7" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="200.7" y="281.6">chưa xong → làm tiếp</tspan></text>
<g class="pulse">
<circle cx="400" cy="367.8" r="78" fill="#4F46E5"/>
<circle cx="400" cy="367.8" r="70" fill="#FFFFFF" fill-opacity="0.14"/>
<text x="400" y="359.8" font-size="34" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🤖</text>
<text font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="400" y="389.8">AI agent</tspan></text>
</g>
<rect x="302" y="118.7" width="196" height="128.2" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<circle cx="400" cy="154.7" r="22" fill="#7C3AED"/>
<circle cx="400" cy="154.7" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="400" y="163" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🧠</text>
<circle cx="320" cy="136.7" r="12" fill="#4C1D95"/>
<text x="320" y="141.7" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text font-size="18.5" fill="#4C1D95" text-anchor="middle" font-weight="700"><tspan x="400" y="203.2">Suy nghĩ</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="400" y="228.1">bước tiếp theo là gì?</tspan></text>
<rect x="462.2" y="396.2" width="196" height="128.2" rx="18" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
