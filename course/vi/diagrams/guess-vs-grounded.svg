<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="198" y="191.3">Đoán cho hợp lý</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="241.5">Dựa vào</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="266.8">Mẫu hình mô hình đã học</tspan></text>
<line x1="44" y1="286.3" x2="352" y2="286.3" stroke="#FFE4E6" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="313.8">Giọng điệu</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="339.1">Rất tự tin</tspan></text>
<line x1="44" y1="358.5" x2="352" y2="358.5" stroke="#FFE4E6" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="386">Kiểm tra được?</tspan></text>
<text font-size="19" fill="#E11D48" text-anchor="start" font-weight="700"><tspan x="44" y="413.3">Không — không có nguồn</tspan></text>
