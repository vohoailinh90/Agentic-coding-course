<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" width="800" height="544" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Đoán cho hợp lý hay có căn cứ?</title>
<desc id="desc">Đoán cho hợp lý — Dựa vào: Mẫu hình mô hình đã học; Giọng điệu: Rất tự tin; Kiểm tra được?: Không — không có nguồn. Có căn cứ — Dựa vào: Tài liệu bạn đưa, kết quả chạy thật; Giọng điệu: Rất tự tin; Kiểm tra được?: Có — trích dẫn, chạy lại. Giọng điệu giống hệt nhau — chỉ căn cứ mới phân biệt được.</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
<rect x="1" y="1" width="798" height="542" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
