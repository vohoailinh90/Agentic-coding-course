<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 616" width="800" height="616" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Người gõ code và trưởng nhóm</title>
<desc id="desc">Người gõ code — Thời gian dành cho: Gõ từng dòng; Câu hỏi của bạn: Viết lệnh này thế nào?; Khi có lỗi: Tự dò từng dòng; Bạn chịu trách nhiệm về: Code chạy được. Trưởng nhóm — Thời gian dành cho: Làm rõ mục tiêu, kiểm tra; Câu hỏi của bạn: Thế nào là xong?; Khi có lỗi: Mô tả lỗi, giao sửa, kiểm lại; Bạn chịu trách nhiệm về: Kết quả đúng và an toàn. Agent gõ thay bạn; quyết định và nghiệm thu vẫn là của bạn.</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
