<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="336.2">Ai kiểm tra kết quả</tspan></text>
<text font-size="19" fill="#E11D48" text-anchor="start" font-weight="700"><tspan x="44" y="363.5">Không ai —</tspan><tspan x="44" y="388.6">&quot;trông có vẻ chạy&quot;</tspan></text>
<line x1="44" y1="408.7" x2="352" y2="408.7" stroke="#FFE4E6" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="436.2">Khi gặp lỗi</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="461.5">Dán lỗi lại,</tspan><tspan x="44" y="483.9">mong lần sau đúng</tspan></text>
<line x1="44" y1="503.4" x2="352" y2="503.4" stroke="#FFE4E6" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="530.9">Hợp với</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="556.2">Thử nghiệm</tspan><tspan x="44" y="578.6">làm xong là bỏ</tspan></text>
</g>
<g class="pulse">
