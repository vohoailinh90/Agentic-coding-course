<text font-size="19" fill="#059669" text-anchor="start" font-weight="700"><tspan x="448" y="363.5">Phép kiểm tra,</tspan><tspan x="448" y="388.6">rồi bạn review</tspan></text>
<line x1="448" y1="408.7" x2="756" y2="408.7" stroke="#D1FAE5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="448" y="436.2">Khi gặp lỗi</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="448" y="461.5">Kiểm tra lại</tspan><tspan x="448" y="483.9">tới khi đạt</tspan></text>
<line x1="448" y1="503.4" x2="756" y2="503.4" stroke="#D1FAE5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="448" y="530.9">Hợp với</tspan></text>
