<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 708" width="800" height="708" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Vibe coding và agentic coding</title>
<desc id="desc">Vibe coding — Bạn đưa gì: Một câu mong muốn; Ai kiểm tra kết quả: Không ai —
&quot;trông có vẻ chạy&quot;; Khi gặp lỗi: Dán lỗi lại,
mong lần sau đúng; Hợp với: Thử nghiệm
làm xong là bỏ. Agentic coding — Bạn đưa gì: Mục tiêu, ranh giới,
phép kiểm tra; Ai kiểm tra kết quả: Phép kiểm tra,
rồi bạn review; Khi gặp lỗi: Kiểm tra lại
tới khi đạt; Hợp với: Thứ có người
dựa vào. Cùng một công cụ; khác nhau ở chỗ có ai kiểm tra kết quả.</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
<rect x="1" y="1" width="798" height="706" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="760" cy="36" r="90" fill="#7C3AED" fill-opacity="0.06"/>
<circle cx="46" cy="678" r="110" fill="#2563EB" fill-opacity="0.05"/>
<text font-size="29" fill="#0F172A" text-anchor="middle" font-weight="700"><tspan x="400" y="55">Vibe coding và agentic coding</tspan></text>
