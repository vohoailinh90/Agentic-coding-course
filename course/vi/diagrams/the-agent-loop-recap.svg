<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 532" width="800" height="532" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Tóm tắt: lần theo vòng lặp của agent</title>
<desc id="desc">1. Từng lượt một — Đọc, chọn công cụ,
chạy, nhận kết quả; 2. Tìm hiểu, làm,
kiểm chứng — Hòa vào nhau và lặp lại; 3. Ngữ cảnh dài ra — Phiên gọn,
đúng việc; 4. Kết thúc hay
tạm dừng? — Đạt hoặc kẹt: kết thúc.
Cần bạn: chờ; 5. Bạn ở trong
vòng lặp — Ngắt sớm,
nói rõ hướng mới. Đọc từng lượt để biết lúc nào nên để yên và lúc nào nên ngắt.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
