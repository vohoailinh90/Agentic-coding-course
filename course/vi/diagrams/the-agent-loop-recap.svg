<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 551" width="800" height="551" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Tóm tắt: lần theo vòng lặp của agent</title>
<desc id="desc">1. Ngữ cảnh, hành động,
kiểm chứng — Lặp tới khi đạt; 2. Kết quả quay về
cuộc trò chuyện — Quyết định
bước tiếp theo; 3. Ba câu hỏi mỗi bước — Làm gì, thấy gì,
có hợp lý không; 4. Một test đạt
chưa đủ — Nó chỉ chứng minh
điều nó kiểm tra; 5. Bạn ngắt được — Và tự kiểm tra
kết quả cuối. Đọc nhật ký phiên là cách bạn giám sát agent.</desc>
