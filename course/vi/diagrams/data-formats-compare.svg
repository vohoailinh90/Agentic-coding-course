<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 615" width="800" height="615" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Ba cách viết cùng một dữ liệu</title>
<desc id="desc">CSV — Trông như: Bảng, cột ngăn bằng dấu phẩy; Hợp để: Bảng tính, Excel; Hay vấp: Dấu phẩy trong một ô. JSON — Trông như: Tên và giá trị trong ngoặc nhọn; Hợp để: Chương trình trao đổi với nhau; Hay vấp: Thiếu một dấu là hỏng. YAML — Trông như: Thụt lề và dấu hai chấm; Hợp để: File cấu hình người viết tay; Hay vấp: Thụt lề lệch là hỏng. Chọn định dạng theo ai sẽ đọc nó — người, bảng tính hay chương trình.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
