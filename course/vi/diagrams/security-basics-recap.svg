<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 463" width="800" height="463" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Tóm tắt: giữ bí mật ngoài nơi công khai</title>
<desc id="desc">1. Key là mật khẩu — Có thể mở quyền dưới tên bạn; 2. Cất ngoài code — Biến môi trường hoặc file bỏ qua; 3. Không chia sẻ — Không chat, ảnh chụp, kho công khai; 4. Lộ thì thu hồi — Tạo lại và kiểm tra lượt dùng. Xóa một dòng không vô hiệu hóa bí mật đã bị sao chép.</desc>
