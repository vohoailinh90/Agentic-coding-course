<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 614" width="800" height="614" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">File chỉ dẫn, bộ nhớ, kỹ năng</title>
<desc id="desc">File chỉ dẫn — Ai viết: Bạn; Nạp khi nào: Mọi phiên; Dùng cho: Quy tắc ngắn,
đúng mọi việc. Bộ nhớ tự động — Ai viết: Agent; Nạp khi nào: Mọi phiên
(phần đầu); Dùng cho: Điều học được
từ lời sửa. Kỹ năng — Ai viết: Bạn
(hoặc cài); Nạp khi nào: Chỉ khi
cần dùng; Dùng cho: Quy trình
nhiều bước. Quy tắc thì luôn có; quy trình thì nạp khi cần; bộ nhớ thì đọc lại.</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
