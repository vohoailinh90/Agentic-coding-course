<rect x="28" y="345" width="744" height="49.8" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text font-size="18" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="376">💡 Mô hình đề nghị; chương trình kiểm tra và thực thi.</tspan></text>
