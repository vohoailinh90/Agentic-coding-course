<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 423" width="800" height="423" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Từ yêu cầu đến kết quả công cụ</title>
<desc id="desc">Người dùng nêu mục tiêu → Mô hình tạo lời gọi → Chương trình chạy công cụ → Mô hình trả lời. Mô hình đề nghị; chương trình kiểm tra và thực thi.</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
