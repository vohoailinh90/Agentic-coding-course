<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 691" width="800" height="691" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Ba cách thực hành với agent</title>
<desc id="desc">Máy cá nhân — Cài đặt: Một ứng dụng agent; File nằm ở đâu?: Trên máy của bạn; Hợp khi: Bạn có máy riêng; Lưu ý: Chỉ làm trong ai-practice. Trình duyệt (đám mây) — Cài đặt: Không cần cài; File nằm ở đâu?: Kho code trên mạng; Hợp khi: Không cài được phần mềm; Lưu ý: Cần tài khoản GitHub. Máy công ty — Cài đặt: Chỉ công cụ được duyệt; File nằm ở đâu?: Theo quy định công ty; Hợp khi: Công ty đã cho phép; Lưu ý: Bài tập chỉ dùng dữ liệu giả. Chưa chắc được phép? Hỏi trước — hoặc học trên máy cá nhân.</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
