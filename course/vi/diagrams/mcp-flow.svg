<circle cx="46" cy="104.3" r="12" fill="#064E3B"/>
<text x="46" y="109.3" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text font-size="18.5" fill="#064E3B" text-anchor="middle" font-weight="700"><tspan x="132.7" y="170.8">Agent</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="132.7" y="195.7">mô hình yêu cầu</tspan><tspan x="132.7" y="215.5">một công cụ</tspan></text>
<line x1="243.3" y1="160.3" x2="289.3" y2="160.3" stroke="#475569" stroke-width="3" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-flow)"/>
