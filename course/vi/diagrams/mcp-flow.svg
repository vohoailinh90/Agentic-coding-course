<circle cx="313.3" cy="104.3" r="12" fill="#78350F"/>
<text x="313.3" y="109.3" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text font-size="18.5" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="170.8">MCP server</tspan></text>
