<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 575" width="800" height="575" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Tóm tắt: gia phả của AI</title>
<desc id="desc">1. Năm từ, một gia phả — Tầng dưới nằm trong tầng trên; 2. Luật viết sẵn khác học máy — Luật do người viết, hay học từ ví dụ?; 3. Học sâu là mạng nhiều lớp — Nền của AI về hình, giọng nói, chữ; 4. AI tạo sinh làm ra cái mới — LLM là AI tạo sinh cho chữ; 5. Agent dùng LLM làm bộ não — Viết trôi chảy, vẫn có thể sai. Nghe chữ &quot;AI&quot;, hãy hỏi: làm theo luật hay học từ dữ liệu? Phân loại hay tạo ra cái mới?</desc>
