<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 582" width="800" height="582" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Chatbot như Google Maps, agent như tài xế taxi</title>
<desc id="desc">Chatbot ≈ Google Maps — Bạn nói: “Đường ra sân bay thế nào?”; Ai cầm lái?: Bạn; Việc của bạn: Lái xe, tìm đường, xử lý kẹt xe. AI agent ≈ tài xế taxi — Bạn nói: “Ra sân bay, trước 8 giờ.”; Ai cầm lái?: Tài xế; Việc của bạn: Nói đúng địa chỉ, kiểm tra điểm đến. Dù đi taxi, kiểm tra điểm đến vẫn là việc của bạn.</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
