<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 551" width="800" height="551" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Tóm tắt: thêm quy trình khi việc cần</title>
<desc id="desc">1. Hỏng ở đâu? — Chỉ thêm thứ
chống rủi ro đó; 2. Một câu:
giao thẳng — Xem diff,
kiểm tra nhanh; 3. Chưa rõ:
kế hoạch trước — Nhiều file,
code lạ; 4. Biết đáp án:
test trước — Thấy không đạt,
rồi mới làm; 5. Tốn kém:
review riêng — Ngữ cảnh mới,
bạn đọc lại. Quy trình vừa với rủi ro, không nhiều hơn.</desc>
