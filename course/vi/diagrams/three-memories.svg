<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 637" width="800" height="637" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Agent &quot;nhớ&quot; ở đâu?</title>
<desc id="desc">Kiến thức đã học — Chứa gì: Những gì học lúc huấn luyện; Kéo dài bao lâu: Dừng ở một thời điểm, có thể cũ; Bạn làm gì: Đưa thông tin mới vào khi cần. Cửa sổ ngữ cảnh — Chứa gì: Tin nhắn, file đã đọc, kết quả lệnh; Kéo dài bao lâu: Chỉ trong phiên này; đầy thì kém đi; Bạn làm gì: Mỗi việc một phiên, gọn gàng. File bạn lưu — Chứa gì: Spec, ghi chú, quy ước; Kéo dài bao lâu: Còn mãi, qua nhiều phiên; Bạn làm gì: Ghi điều quan trọng ra file. Điều gì phải được nhớ lâu, hãy ghi ra file — đừng chỉ nói trong cuộc trò chuyện.</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
