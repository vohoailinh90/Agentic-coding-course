<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 663" width="800" height="663" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Trả lời ngay hay nghĩ trước?</title>
<desc id="desc">Trả lời ngay — Cách làm: Viết thẳng câu trả lời; Thời gian: Nhanh; Token: Chỉ phần trả lời; Hợp với: Câu hỏi ngắn,
viết lại một câu. Nghĩ trước — Cách làm: Nháp các bước,
rồi mới trả lời; Thời gian: Lâu hơn; Token: Thêm phần suy nghĩ; Hợp với: Bài nhiều bước,
code, kế hoạch. Nghĩ trước giúp bài nhiều bước, nhưng tốn thời gian và token.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
