<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 916" width="800" height="916" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Chiếc thang độ phức tạp</title>
<desc id="desc">Một yêu cầu → Workflow cố định → Một agent → Agent + subagent. Mỗi bậc thêm tốn thêm — leo vì cần, không vì nghe hiện đại.</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
