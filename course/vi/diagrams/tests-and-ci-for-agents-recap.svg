<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 551" width="800" height="551" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Tóm tắt: test và CI</title>
<desc id="desc">1. Test tự động — Agent tự chạy,
kiểm tra toàn bộ; 2. CI: không ai
quên được — Mỗi lần đẩy lên,
máy sạch; 3. Đỏ: sửa.
Xanh: review — Xanh mới tới
lượt bạn đọc; 4. Đừng sửa test
cho xanh — Sửa code,
không sửa đáp án; 5. Xanh chưa
chắc đúng — Đọc diff,
nhất là file test. Để máy kiểm tra máy — và bạn kiểm tra cả hai.</desc>
