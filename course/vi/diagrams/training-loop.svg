<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 786" width="800" height="786" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Vòng huấn luyện</title>
<desc id="desc">Đoán thử → So với đáp án → Chỉnh các con số. Không ai viết luật cho mô hình; quy luật nằm trong các con số sau huấn luyện.</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient><marker id="arrow-cycle" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker></defs>
<rect x="1" y="1" width="798" height="784" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="760" cy="36" r="90" fill="#7C3AED" fill-opacity="0.06"/>
<circle cx="46" cy="756" r="110" fill="#2563EB" fill-opacity="0.05"/>
<text font-size="29" fill="#0F172A" text-anchor="middle" font-weight="700"><tspan x="400" y="55">Vòng huấn luyện</tspan></text>
<text font-size="17" fill="#475569" text-anchor="middle"><tspan x="400" y="85.3">Lặp lại với rất nhiều ví dụ có đáp án</tspan></text>
<path d="M510.7,213.5 A215,215 0 0 1 612.9,427.8" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="590" y="278.6" width="65.8" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="622.9" y="296.1">đem so</tspan></text>
<path d="M513.9,580.2 A215,215 0 0 1 302.4,589.4" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="390" y="631.7" width="41.5" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="410.8" y="649.2">sửa</tspan></text>
<path d="M186.2,420.3 A215,215 0 0 1 289.3,213.5" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="144" y="274.7" width="69.8" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="179" y="292.2">lần tiếp</tspan></text>
<g class="pulse">
<circle cx="400" cy="397.8" r="78" fill="#4F46E5"/>
<circle cx="400" cy="397.8" r="70" fill="#FFFFFF" fill-opacity="0.14"/>
<text x="400" y="389.8" font-size="34" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🔁</text>
<text font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="400" y="419.8">Lặp thật</tspan><tspan x="400" y="441">nhiều lần</tspan></text>
</g>
<rect x="302" y="118.7" width="196" height="128.2" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<circle cx="400" cy="154.7" r="22" fill="#2563EB"/>
<circle cx="400" cy="154.7" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="400" y="163" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🎯</text>
<circle cx="320" cy="136.7" r="12" fill="#1E3A8A"/>
<text x="320" y="141.7" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text font-size="18.5" fill="#1E3A8A" text-anchor="middle" font-weight="700"><tspan x="400" y="203.2">Đoán thử</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="400" y="228.1">với các con số hiện có</tspan></text>
<rect x="488.2" y="441.2" width="196" height="128.2" rx="18" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<circle cx="586.2" cy="477.2" r="22" fill="#059669"/>
<circle cx="586.2" cy="477.2" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="586.2" y="485.5" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">✅</text>
<circle cx="506.2" cy="459.2" r="12" fill="#064E3B"/>
<text x="506.2" y="464.2" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text font-size="18.5" fill="#064E3B" text-anchor="middle" font-weight="700"><tspan x="586.2" y="525.7">So với đáp án</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="586.2" y="550.6">sai bao xa?</tspan></text>
<rect x="115.8" y="431.3" width="196" height="148" rx="18" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
<circle cx="213.8" cy="467.3" r="22" fill="#D97706"/>
<circle cx="213.8" cy="467.3" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="213.8" y="475.6" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🔧</text>
<circle cx="133.8" cy="449.3" r="12" fill="#78350F"/>
<text x="133.8" y="454.3" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text font-size="18.5" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="213.8" y="515.8">Chỉnh các con số</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="213.8" y="540.7">để lần sau gần đúng</tspan><tspan x="213.8" y="560.5">hơn</tspan></text>
<rect x="28" y="683.5" width="744" height="73.5" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text font-size="18" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="714.5">💡 Không ai viết luật cho mô hình; quy luật nằm trong các con số sau</tspan><tspan x="400" y="738.3">huấn luyện.</tspan></text>
</svg>
