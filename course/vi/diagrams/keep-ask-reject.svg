<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 591" width="800" height="591" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Đọc diff xong: giữ, hỏi hay từ chối?</title>
<desc id="desc">Giữ — Khi: Đúng việc, đúng chỗ, đủ nhỏ; Ví dụ: Chỉ đổi đúng dòng tiêu đề; Bạn nói: Chấp nhận. Hỏi — Khi: Có chỗ bạn chưa hiểu; Ví dụ: Một file mới lạ xuất hiện; Bạn nói: “Dòng này để làm gì?”. Từ chối — Khi: Đụng thứ bạn không yêu cầu; Ví dụ: Xóa mất một việc trong danh sách; Bạn nói: Từ chối, nói rõ vì sao. Việc nhỏ mà thay đổi to là dấu hiệu nên đọc kỹ.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
<rect x="1" y="1" width="798" height="589" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="760" cy="36" r="90" fill="#7C3AED" fill-opacity="0.06"/>
<circle cx="46" cy="561" r="110" fill="#2563EB" fill-opacity="0.05"/>
<text font-size="29" fill="#0F172A" text-anchor="middle" font-weight="700"><tspan x="400" y="55">Đọc diff xong: giữ, hỏi hay từ chối?</tspan></text>
<g>
<rect x="28" y="86.3" width="236" height="402.7" rx="20" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
<path d="M28,106.3 a20,20 0 0 1 20,-20 h196 a20,20 0 0 1 20,20 v107.7 h-236 z" fill="#059669"/>
<circle cx="146" cy="138.3" r="26" fill="#059669"/>
<circle cx="146" cy="138.3" r="23" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="146" y="148.1" font-size="27.3" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">✅</text>
<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="146" y="191.3">Giữ</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="241.5">Khi</tspan></text>
<text font-size="19" fill="#059669" text-anchor="start" font-weight="700"><tspan x="44" y="268.8">Đúng việc, đúng</tspan><tspan x="44" y="293.9">chỗ, đủ nhỏ</tspan></text>
<line x1="44" y1="314" x2="248" y2="314" stroke="#D1FAE5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="341.5">Ví dụ</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="366.8">Chỉ đổi đúng dòng tiêu</tspan><tspan x="44" y="389.2">đề</tspan></text>
<line x1="44" y1="408.7" x2="248" y2="408.7" stroke="#D1FAE5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="436.2">Bạn nói</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="461.5">Chấp nhận</tspan></text>
</g>
<g>
<rect x="282" y="86.3" width="236" height="402.7" rx="20" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<path d="M282,106.3 a20,20 0 0 1 20,-20 h196 a20,20 0 0 1 20,20 v107.7 h-236 z" fill="#D97706"/>
<circle cx="400" cy="138.3" r="26" fill="#D97706"/>
<circle cx="400" cy="138.3" r="23" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="400" y="148.1" font-size="27.3" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">💬</text>
<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="400" y="191.3">Hỏi</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="298" y="241.5">Khi</tspan></text>
<text font-size="19" fill="#D97706" text-anchor="start" font-weight="700"><tspan x="298" y="268.8">Có chỗ bạn chưa</tspan><tspan x="298" y="293.9">hiểu</tspan></text>
<line x1="298" y1="314" x2="502" y2="314" stroke="#FEF3C7" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="298" y="341.5">Ví dụ</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="298" y="366.8">Một file mới lạ xuất</tspan><tspan x="298" y="389.2">hiện</tspan></text>
<line x1="298" y1="408.7" x2="502" y2="408.7" stroke="#FEF3C7" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="298" y="436.2">Bạn nói</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="298" y="461.5">“Dòng này để làm gì?”</tspan></text>
</g>
<g>
<rect x="536" y="86.3" width="236" height="402.7" rx="20" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/>
<path d="M536,106.3 a20,20 0 0 1 20,-20 h196 a20,20 0 0 1 20,20 v107.7 h-236 z" fill="#E11D48"/>
<circle cx="654" cy="138.3" r="26" fill="#E11D48"/>
<circle cx="654" cy="138.3" r="23" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="654" y="148.1" font-size="27.3" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">❌</text>
<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="654" y="191.3">Từ chối</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="552" y="241.5">Khi</tspan></text>
<text font-size="19" fill="#E11D48" text-anchor="start" font-weight="700"><tspan x="552" y="268.8">Đụng thứ bạn không</tspan><tspan x="552" y="293.9">yêu cầu</tspan></text>
<line x1="552" y1="314" x2="756" y2="314" stroke="#FFE4E6" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="552" y="341.5">Ví dụ</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="552" y="366.8">Xóa mất một việc</tspan><tspan x="552" y="389.2">trong danh sách</tspan></text>
<line x1="552" y1="408.7" x2="756" y2="408.7" stroke="#FFE4E6" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="552" y="436.2">Bạn nói</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="552" y="461.5">Từ chối, nói rõ vì sao</tspan></text>
</g>
<rect x="28" y="512.9" width="744" height="49.8" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text font-size="18" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="543.9">💡 Việc nhỏ mà thay đổi to là dấu hiệu nên đọc kỹ.</tspan></text>
</svg>
