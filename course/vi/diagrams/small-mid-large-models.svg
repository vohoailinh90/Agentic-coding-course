<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 641" width="800" height="641" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Mô hình nhỏ, vừa hay lớn?</title>
<desc id="desc">Nhỏ — Hợp với: Việc ngắn,
lặp lại; Tốc độ: Nhanh nhất; Chi phí mỗi token: Thấp; Ví dụ Claude (9/2026): Haiku. Vừa — Hợp với: Phần lớn
việc hằng ngày; Tốc độ: Nhanh; Chi phí mỗi token: Vừa; Ví dụ Claude (9/2026): Sonnet. Lớn — Hợp với: Việc khó,
nhiều bước; Tốc độ: Chậm hơn; Chi phí mỗi token: Cao; Ví dụ Claude (9/2026): Opus, Fable. Chọn mô hình đủ tốt cho việc, không phải mô hình mạnh nhất.</desc>
