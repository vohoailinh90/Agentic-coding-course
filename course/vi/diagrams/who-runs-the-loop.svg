<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 708" width="800" height="708" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Ai chạy vòng lặp?</title>
<desc id="desc">Truyền thống — Ai viết code: Bạn,
từng dòng; Ai chạy, đọc lỗi, sửa: Bạn; Việc chính của bạn: Gõ code,
dò lỗi; Chỗ dễ nghẽn: Tốc độ gõ,
nhớ cú pháp. Agentic — Ai viết code: Agent; Ai chạy, đọc lỗi, sửa: Agent,
trong vòng lặp; Việc chính của bạn: Nói rõ mục tiêu,
duyệt bằng chứng; Chỗ dễ nghẽn: Yêu cầu mơ hồ,
không có phép kiểm tra. Agent chạy vòng lặp; bạn đặt mục tiêu và kiểm tra.</desc>
