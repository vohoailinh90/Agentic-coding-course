<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 551" width="800" height="551" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Tóm tắt: cửa sổ ngữ cảnh</title>
<desc id="desc">1. Trí nhớ làm việc — Mọi thứ agent xem được lúc này; 2. Cái gì cũng chiếm chỗ — Tin nhắn, file đã đọc, kết quả lệnh; 3. Đầy quá thì kém đi — Quên dặn dò cũ, sai nhiều hơn; 4. Mỗi việc một phiên — Việc mới không liên quan? Phiên mới; 5. Ghi điều quan trọng ra file — Agent đọc lại được ở phiên sau. Ngữ cảnh ít mà đúng tốt hơn nhiều mà lộn xộn.</desc>
