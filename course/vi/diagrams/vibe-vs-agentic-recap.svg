<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 551" width="800" height="551" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Tóm tắt: vibe coding và agentic coding</title>
<desc id="desc">1. Vibe coding — Không đọc, không kiểm tra,
có vẻ chạy là giữ; 2. Agentic thêm
bốn thứ — Mục tiêu, ranh giới,
kiểm tra, review; 3. Cùng một công cụ — Khác ở cách làm; 4. Sai thì
ai bị thiệt? — Không ai: vibe được.
Có người: agentic; 5. Chạy được
chưa chắc đúng — Lỗi âm thầm cần
phép kiểm tra. Vibe để thử; có người dựa vào thì kiểm tra.</desc>
