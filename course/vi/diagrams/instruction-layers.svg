<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 374" width="800" height="374" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Ba lớp chỉ dẫn của agent</title>
<desc id="desc">System prompt → File chỉ dẫn → Yêu cầu của việc. Hai lớp sau là của bạn — viết chúng như cho một nhân viên mới.</desc>
<style>
