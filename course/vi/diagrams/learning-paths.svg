</g>
<rect x="28" y="563.1" width="744" height="73.5" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text font-size="18" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="594.1">💡 Đi chậm cũng được — miễn là mỗi buổi đều có sản phẩm và bằng</tspan><tspan x="400" y="617.9">chứng.</tspan></text>
