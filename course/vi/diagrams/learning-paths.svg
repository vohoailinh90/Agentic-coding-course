<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 665" width="800" height="665" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Chọn cách đi qua khóa học</title>
<desc id="desc">Lộ trình tối thiểu — Gồm: Các bài có dấu ⭐; Hợp khi: Muốn sớm làm được việc thật; Bạn làm ra: Trang cá nhân, báo cáo tự động. Cả khóa học — Gồm: Mọi bài chính, theo thứ tự; Hợp khi: Muốn hiểu vững, làm chắc; Bạn làm ra: Thêm quy trình và phép kiểm tra tự động. Học thêm khi cần — Gồm: Chủ đề tùy chọn và nâng cao; Hợp khi: Tò mò hay gặp việc cụ thể; Bạn làm ra: Theo dự án của riêng bạn. Đi chậm cũng được — miễn là mỗi buổi đều có sản phẩm và bằng chứng.</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
<rect x="1" y="1" width="798" height="663" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="760" cy="36" r="90" fill="#7C3AED" fill-opacity="0.06"/>
<circle cx="46" cy="635" r="110" fill="#2563EB" fill-opacity="0.05"/>
<text font-size="29" fill="#0F172A" text-anchor="middle" font-weight="700"><tspan x="400" y="55">Chọn cách đi qua khóa học</tspan></text>
<g class="pulse">
<rect x="28" y="86.3" width="236" height="452.8" rx="20" fill="#FFFBEB" stroke="#D97706" stroke-width="3.5"/>
<path d="M28,106.3 a20,20 0 0 1 20,-20 h196 a20,20 0 0 1 20,20 v135.4 h-236 z" fill="#D97706"/>
<circle cx="146" cy="138.3" r="26" fill="#D97706"/>
<circle cx="146" cy="138.3" r="23" fill="#FFFFFF" fill-opacity="0.2"/>
