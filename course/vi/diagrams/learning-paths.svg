<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="146" y="191.3">Lộ trình tối</tspan><tspan x="146" y="219">thiểu</tspan></text>
<rect x="87.1" y="73.7" width="117.8" height="25.2" rx="12.6" fill="#0F172A"/>
<text font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="146" y="90.7">Bắt đầu ở đây</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="269.2">Gồm</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="294.5">Các bài có dấu ⭐</tspan></text>
<line x1="44" y1="336.4" x2="248" y2="336.4" stroke="#FEF3C7" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="363.9">Hợp khi</tspan></text>
<text font-size="19" fill="#D97706" text-anchor="start" font-weight="700"><tspan x="44" y="391.2">Muốn sớm làm được</tspan><tspan x="44" y="416.3">việc thật</tspan></text>
<line x1="44" y1="436.4" x2="248" y2="436.4" stroke="#FEF3C7" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="463.9">Bạn làm ra</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="489.2">Trang cá nhân, báo cáo</tspan><tspan x="44" y="511.7">tự động</tspan></text>
</g>
