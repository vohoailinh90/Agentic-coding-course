<line x1="552" y1="436.4" x2="756" y2="436.4" stroke="#D1FAE5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="552" y="463.9">Bạn làm ra</tspan></text>
