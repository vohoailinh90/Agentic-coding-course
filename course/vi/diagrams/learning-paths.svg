<line x1="298" y1="436.4" x2="502" y2="436.4" stroke="#DBEAFE" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="298" y="463.9">Bạn làm ra</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="298" y="489.2">Thêm quy trình và</tspan><tspan x="298" y="511.7">phép kiểm tra tự động</tspan></text>
</g>
