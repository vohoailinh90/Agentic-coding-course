<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 551" width="800" height="551" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Tóm tắt: truyền thống và agentic</title>
<desc id="desc">1. Vòng lặp của nghề — Viết, chạy,
đọc lỗi, sửa; 2. Truyền thống:
bạn là vòng lặp — Từng dòng một; 3. Agentic:
agent chạy vòng lặp — Bạn đặt mục tiêu,
duyệt bằng chứng; 4. Có cách
kiểm tra — Không thì bạn
phải tự bắt lỗi; 5. Nền móng giữ nguyên — Test, Git, đọc thay đổi,
trách nhiệm. Ít gõ hơn, nhưng phải nói rõ hơn và kiểm tra kỹ hơn.</desc>
