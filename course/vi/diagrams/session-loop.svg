<text font-size="18.5" fill="#134E4A" text-anchor="middle" font-weight="700"><tspan x="218.1" y="540.3">Kiểm chứng</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="218.1" y="565.3">chạy lại test</tspan></text>
<rect x="28" y="695.9" width="744" height="49.8" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text font-size="18" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="726.9">💡 Mỗi bước, hỏi: làm gì, thấy gì, bước sau có hợp lý không?</tspan></text>
