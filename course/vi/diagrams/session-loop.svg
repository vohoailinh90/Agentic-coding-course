<text font-size="17" fill="#475569" text-anchor="middle"><tspan x="400" y="85.3">Lặp lại tới khi phép kiểm tra đạt — bạn ngắt được bất cứ lúc nào</tspan></text>
<path d="M508.2,234.9 A210,210 0 0 1 608,444.2" fill="none" stroke="#059669" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="556" y="297.8" width="124.9" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="618.4" y="315.3">biết phải sửa gì</tspan></text>
<path d="M508.2,594.9 A210,210 0 0 1 291.8,594.9" fill="none" stroke="#059669" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="353.5" y="644" width="93.1" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="400" y="661.5">đã thay đổi</tspan></text>
<path d="M192,444.2 A210,210 0 0 1 291.8,234.9" fill="none" stroke="#059669" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="104.1" y="297.8" width="154.9" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="181.6" y="315.3">chưa đạt → làm tiếp</tspan></text>
