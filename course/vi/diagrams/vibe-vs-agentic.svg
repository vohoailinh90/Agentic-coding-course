<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 686" width="800" height="686" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Vibe coding hay agentic coding?</title>
<desc id="desc">Vibe coding — Bạn đọc thay đổi?: Không; Biết xong khi: Trông có vẻ
chạy được; Khi có lỗi: Dán lỗi cho AI,
nhận bản sửa; Hợp với: Thử nghiệm
bỏ đi được. Agentic coding — Bạn đọc thay đổi?: Có; Biết xong khi: Tiêu chí viết trước
đều đạt; Khi có lỗi: Tìm nguyên nhân,
kiểm tra lại; Hợp với: Việc có người
dựa vào. Khác nhau ở việc bạn làm với kết quả, không phải ở công cụ.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
<rect x="1" y="1" width="798" height="684" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="760" cy="36" r="90" fill="#7C3AED" fill-opacity="0.06"/>
<circle cx="46" cy="656" r="110" fill="#2563EB" fill-opacity="0.05"/>
