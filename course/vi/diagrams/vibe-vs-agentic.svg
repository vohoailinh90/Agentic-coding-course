<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="266.8">Không</tspan></text>
<line x1="44" y1="286.3" x2="352" y2="286.3" stroke="#FFEDD5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="313.8">Biết xong khi</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="339.1">Trông có vẻ</tspan><tspan x="44" y="361.5">chạy được</tspan></text>
