<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="227.5" y="517.1">trả về</tspan></text>
<path d="M225.1,298.6 A190,190 0 0 1 291,217.2" fill="none" stroke="#059669" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="190.8" y="220.2" width="73.3" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="227.5" y="237.7">lượt sau</tspan></text>
