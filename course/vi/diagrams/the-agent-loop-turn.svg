<text font-size="17" fill="#475569" text-anchor="middle"><tspan x="400" y="85.3">Lặp lại tới khi kiểm tra đạt hoặc bị kẹt; chờ khi cần bạn</tspan></text>
<path d="M509,217.2 A190,190 0 0 1 574.9,298.6" fill="none" stroke="#059669" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
