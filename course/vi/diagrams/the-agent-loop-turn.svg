<circle cx="130" cy="326.7" r="12" fill="#134E4A"/>
<text x="130" y="331.7" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text font-size="18.5" fill="#134E4A" text-anchor="middle" font-weight="700"><tspan x="210" y="393.2">Kết quả quay lại</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="210" y="418.1">vào ngữ cảnh</tspan></text>
