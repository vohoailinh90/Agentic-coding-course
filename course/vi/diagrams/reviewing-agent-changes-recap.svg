<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 507" width="800" height="507" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Tóm tắt: đọc một diff</title>
<desc id="desc">1. File nào đổi? — Có đúng file bạn nghĩ không; 2. To hay nhỏ? — Việc nhỏ mà diff to là lạ; 3. Đọc phần bạn hiểu — Chữ, số, tên hiển thị; 4. Tìm dấu hiệu lạ — Dòng bị xóa, file mới, mật khẩu; 5. Giữ, hỏi hay từ chối — Và nói rõ vì sao. Không cần hiểu từng dòng code mới review được — cần biết nhìn vào đâu.</desc>
