<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 641" width="800" height="641" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Thêm cấu trúc theo rủi ro</title>
<desc id="desc">Giao thẳng — Dùng khi: Tả được
trong một câu; Chống rủi ro: Mất thời gian
vô ích; Tốn thêm: Gần như không. Kế hoạch trước — Dùng khi: Chưa rõ cách,
nhiều file; Chống rủi ro: Giải đúng
vấn đề sai; Tốn thêm: Vài phút đọc. Test trước — Dùng khi: Biết trước
kết quả đúng; Chống rủi ro: &quot;Trông có vẻ
đúng&quot;; Tốn thêm: Viết vài
trường hợp. Review riêng — Dùng khi: Sai thì
tốn kém; Chống rủi ro: Điểm mù của
người làm; Tốn thêm: Một phiên
mới. Hỏi &quot;việc này có thể hỏng ở đâu?&quot;, rồi chỉ thêm đúng thứ cần.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
