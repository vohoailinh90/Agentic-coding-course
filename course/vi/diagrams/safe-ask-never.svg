<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 614" width="800" height="614" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Ba loại việc khi giao cho agent</title>
<desc id="desc">An toàn — Ví dụ: Tạo, sửa file trong ai-practice; Ví dụ khác: Dữ liệu giả, chạy thử trang; Agent nên: Cứ làm, rồi báo cáo. Hỏi trước — Ví dụ: Cài đặt, xóa file; Ví dụ khác: Gửi ra ngoài, ra khỏi thư mục; Agent nên: Dừng lại và hỏi bạn. Không bao giờ — Ví dụ: Dữ liệu thật của công ty, khách hàng; Ví dụ khác: Mật khẩu, API key, lách quy định; Agent nên: Không làm, dù được bảo. Chưa chắc việc thuộc loại nào? Xếp nó vào &quot;hỏi trước&quot;.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
<rect x="1" y="1" width="798" height="612" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="760" cy="36" r="90" fill="#7C3AED" fill-opacity="0.06"/>
<circle cx="46" cy="584" r="110" fill="#2563EB" fill-opacity="0.05"/>
