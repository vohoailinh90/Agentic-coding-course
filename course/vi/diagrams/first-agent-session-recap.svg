<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 463" width="800" height="463" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Tóm tắt: buổi đầu với agent</title>
<desc id="desc">1. Yêu cầu có tiêu chí — Việc cần làm và thế nào là xong; 2. Chế độ hỏi trước — Đọc từng thay đổi rồi mới chấp nhận; 3. Nói rõ chỗ sai — Mình làm gì, thấy gì, mong đợi gì; 4. Tự nghiệm thu, ghi bằng chứng — Ba dòng cho sản phẩm đầu tiên. Thẻ &quot;Việc của tôi trong tuần&quot; sẽ còn đi cùng bạn ở các bài sau.</desc>
