<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 463" width="800" height="463" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Tóm tắt: học khóa này thế nào</title>
<desc id="desc">1. Bắt đầu từ lộ trình tối thiểu — Các bài có dấu ⭐ trên trang chính; 2. Ghi nhật ký mỗi buổi — Sản phẩm, bằng chứng, một câu hỏi; 3. Giữ một câu hỏi còn mở — Mang theo sang buổi sau; 4. Lỡ một tuần không sao — Mở nhật ký, học tiếp từ đó. Nhật ký học là bằng chứng rằng bạn đang tiến bộ.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
