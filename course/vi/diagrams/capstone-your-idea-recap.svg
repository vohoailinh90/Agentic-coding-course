<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 503" width="800" height="503" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Tóm tắt: dự án cuối khóa</title>
<desc id="desc">1. Ba bộ lọc — Nhỏ, kiểm tra được,
an toàn; 2. Một trang dự án — Tiêu chí xong và
ranh giới rõ; 3. Mốc có kiểm tra — Mỗi mốc
một commit; 4. Kiểm chứng — Làm hỏng thử và
review trong ngữ cảnh mới; 5. Trình bày năm phút — Bằng chứng
và giới hạn. Nhỏ, đúng, có bằng chứng — đó là một dự án xong.</desc>
