<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 661" width="800" height="661" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Prompt, RAG, fine-tuning: đổi chỗ nào?</title>
<desc id="desc">Prompt — Thay đổi gì?: Lời bạn dặn; Hợp khi: Cách làm, định dạng, giọng văn; Công sức: Ít nhất; Khi thông tin đổi: Sửa prompt. RAG — Thay đổi gì?: Tài liệu AI được đọc; Hợp khi: Kiến thức riêng, hay đổi; Công sức: Vừa: tài liệu
và tìm kiếm; Khi thông tin đổi: Cập nhật tài liệu. Fine-tuning — Thay đổi gì?: Chính mô hình; Hợp khi: Văn phong,
kỹ năng ổn định; Công sức: Nhiều nhất: dữ liệu và huấn luyện; Khi thông tin đổi: Huấn luyện lại. Thử lần lượt prompt → RAG → fine-tuning; đủ tốt thì dừng.</desc>
<style>
