<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 789" width="800" height="789" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="vi">
<title id="title">Bốn hình dạng của công cụ AI</title>
<desc id="desc">Chat trên web — Chạy ở đâu: Trình duyệt; File nằm ở đâu: Bạn tự
sao chép; Tự chạy lệnh?: Thường không; Hợp khi: Hỏi, giải thích,
soạn nháp. Trợ lý
trình soạn code — Chạy ở đâu: Trình soạn
code; File nằm ở đâu: File đang
mở; Tự chạy lệnh?: Gợi ý;
đôi khi có; Hợp khi: Đang tự
sửa code. Agent trên máy — Chạy ở đâu: Máy bạn; File nằm ở đâu: Thư mục
của bạn; Tự chạy lệnh?: Có, theo
quyền bạn cho; Hợp khi: Được cài,
file trên máy. Agent đám mây — Chạy ở đâu: Máy chủ
nhà cung cấp; File nằm ở đâu: Kho code
trên mạng; Tự chạy lệnh?: Có, trên
máy chủ; Hợp khi: Không cài được,
có GitHub. Chọn hình dạng theo môi trường trước, rồi mới so tên hãng.</desc>
<style>
