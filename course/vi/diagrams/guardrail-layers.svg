<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="146" y="191.3">Lời dặn</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="241.5">Ai thực thi</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="266.8">Mô hình</tspan></text>
<line x1="44" y1="286.3" x2="248" y2="286.3" stroke="#DBEAFE" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="313.8">Có thể bị quên?</tspan></text>
<text font-size="19" fill="#2563EB" text-anchor="start" font-weight="700"><tspan x="44" y="341.1">Có — hiểu sai</tspan><tspan x="44" y="366.2">hay quên</tspan></text>
<line x1="44" y1="386.2" x2="248" y2="386.2" stroke="#DBEAFE" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="413.7">Dùng cho</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="439.1">Quy ước,</tspan><tspan x="44" y="461.5">cách làm</tspan></text>
</g>
