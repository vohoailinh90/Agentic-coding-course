<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="654" y="191.3">Hook</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="552" y="241.5">Ai thực thi</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="552" y="266.8">Công cụ</tspan></text>
