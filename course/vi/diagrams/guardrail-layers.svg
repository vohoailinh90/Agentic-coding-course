<line x1="552" y1="386.2" x2="756" y2="386.2" stroke="#EDE9FE" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="552" y="413.7">Dùng cho</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="552" y="439.1">Chặn, kiểm tra,</tspan><tspan x="552" y="461.5">báo tin</tspan></text>
</g>
