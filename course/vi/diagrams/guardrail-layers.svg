<line x1="298" y1="386.2" x2="502" y2="386.2" stroke="#FFE4E6" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="298" y="413.7">Dùng cho</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="298" y="439.1">Cho phép,</tspan><tspan x="298" y="461.5">hỏi, cấm</tspan></text>
</g>
