<title id="title">Instructions, Memory, Skills</title>
<desc id="desc">Instruction file — Who writes it: You; When it loads: Every session; Use it for: Short rules
for every task. Auto memory — Who writes it: The agent; When it loads: Every session
(the first part); Use it for: Lessons from
your corrections. Skill — Who writes it: You
(or installed); When it loads: Only when
needed; Use it for: Multi-step
procedures. Rules always there; procedures when needed; memory read back.</desc>
