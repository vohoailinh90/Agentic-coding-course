<title id="title">A Small, Mid-Size or Large Model?</title>
<desc id="desc">Small — Good for: Short, repeated
tasks; Speed: Fastest; Cost per token: Low; Claude example (9/2026): Haiku. Mid-size — Good for: Most everyday
work; Speed: Fast; Cost per token: Medium; Claude example (9/2026): Sonnet. Large — Good for: Hard,
multi-step work; Speed: Slower; Cost per token: High; Claude example (9/2026): Opus, Fable. Pick the model that is good enough for the task,
not the strongest one.</desc>
