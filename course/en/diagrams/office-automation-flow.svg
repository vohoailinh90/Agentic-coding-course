<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 494" width="800" height="494" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">From Sales Sheet to Report, Every Month</title>
<desc id="desc">This month&#x27;s data → The program → The report → Compare with known answers. Next month: swap the data file, run it again, check again.</desc>
<style>
