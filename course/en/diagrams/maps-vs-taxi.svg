<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 604" width="800" height="604" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">A Chatbot Is Like Google Maps, an Agent Like a Taxi Driver</title>
<desc id="desc">Chatbot ≈ Google Maps — You say: “How do I get to the airport?”; Who drives?: You; Your job: Drive, navigate, handle the traffic. AI agent ≈ taxi driver — You say: “The airport, before 8.”; Who drives?: The driver; Your job: Give the right address, check where you arrive. Even in a taxi, checking where you arrived is your job.</desc>
<style>
