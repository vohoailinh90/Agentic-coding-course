<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="146" y="191.3">Safe</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="241.5">For example</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="266.8">Create and edit files in</tspan><tspan x="44" y="289.3">ai-practice</tspan></text>
<line x1="44" y1="308.7" x2="248" y2="308.7" stroke="#D1FAE5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="336.2">Also</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="361.5">Made-up data, test</tspan><tspan x="44" y="384">runs</tspan></text>
<line x1="44" y1="403.4" x2="248" y2="403.4" stroke="#D1FAE5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="430.9">The agent should</tspan></text>
<text font-size="19" fill="#059669" text-anchor="start" font-weight="700"><tspan x="44" y="458.2">Go ahead, then</tspan><tspan x="44" y="483.3">report</tspan></text>
</g>
<g>
<rect x="282" y="86.3" width="236" height="425.1" rx="20" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<path d="M282,106.3 a20,20 0 0 1 20,-20 h196 a20,20 0 0 1 20,20 v107.7 h-236 z" fill="#D97706"/>
<circle cx="400" cy="138.3" r="26" fill="#D97706"/>
<circle cx="400" cy="138.3" r="23" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="400" y="148.1" font-size="27.3" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">✋</text>
<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="400" y="191.3">Ask first</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="298" y="241.5">For example</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="298" y="266.8">Installing, deleting</tspan><tspan x="298" y="289.3">files</tspan></text>
<line x1="298" y1="308.7" x2="502" y2="308.7" stroke="#FEF3C7" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="298" y="336.2">Also</tspan></text>
