<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="654" y="191.3">Never</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="552" y="241.5">For example</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="552" y="266.8">Real company or</tspan><tspan x="552" y="289.3">customer data</tspan></text>
<line x1="552" y1="308.7" x2="756" y2="308.7" stroke="#FFE4E6" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="552" y="336.2">Also</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="552" y="361.5">Passwords, API keys,</tspan><tspan x="552" y="384">workarounds</tspan></text>
<line x1="552" y1="403.4" x2="756" y2="403.4" stroke="#FFE4E6" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="552" y="430.9">The agent should</tspan></text>
<text font-size="19" fill="#E11D48" text-anchor="start" font-weight="700"><tspan x="552" y="458.2">Refuse, even when</tspan><tspan x="552" y="483.3">told to</tspan></text>
