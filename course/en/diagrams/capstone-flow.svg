<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1054" width="800" height="1054" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">The Capstone, from Idea to Evidence</title>
<desc id="desc">Pick an idea → A one-page plan → Build milestone by milestone → Verify → Evidence and demo. Everything in the course, on a problem of your own.</desc>
