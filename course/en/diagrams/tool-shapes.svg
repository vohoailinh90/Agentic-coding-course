<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 761" width="800" height="761" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">Four Shapes of AI Tools</title>
<desc id="desc">Web chat — Where it runs: Browser; Where files live: You copy
it out; Runs commands?: Usually not; Good when: Questions,
drafts. Editor assistant — Where it runs: Code editor; Where files live: The open
file; Runs commands?: Suggests;
sometimes; Good when: Editing code
yourself. Local agent — Where it runs: Your computer; Where files live: Your folder; Runs commands?: Yes, within
your permissions; Good when: You can install,
files are local. Cloud agent — Where it runs: Provider&#x27;s
servers; Where files live: An online
repository; Runs commands?: Yes, on
the server; Good when: No installs,
have GitHub. Pick the shape for your environment first, then compare brands.</desc>
