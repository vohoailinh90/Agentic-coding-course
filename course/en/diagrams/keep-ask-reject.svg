<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="146" y="191.3">Keep</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="241.5">When</tspan></text>
<text font-size="19" fill="#059669" text-anchor="start" font-weight="700"><tspan x="44" y="268.8">Right task, right</tspan><tspan x="44" y="293.9">place, small</tspan></text>
<line x1="44" y1="314" x2="248" y2="314" stroke="#D1FAE5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="341.5">For example</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="366.8">Only the title line</tspan><tspan x="44" y="389.2">changed</tspan></text>
<line x1="44" y1="408.7" x2="248" y2="408.7" stroke="#D1FAE5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="436.2">You say</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="461.5">Accept</tspan></text>
</g>
<g>
<rect x="282" y="86.3" width="236" height="425.1" rx="20" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<path d="M282,106.3 a20,20 0 0 1 20,-20 h196 a20,20 0 0 1 20,20 v107.7 h-236 z" fill="#D97706"/>
<circle cx="400" cy="138.3" r="26" fill="#D97706"/>
<circle cx="400" cy="138.3" r="23" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="400" y="148.1" font-size="27.3" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">💬</text>
<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="400" y="191.3">Ask</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="298" y="241.5">When</tspan></text>
<text font-size="19" fill="#D97706" text-anchor="start" font-weight="700"><tspan x="298" y="268.8">Something you do</tspan><tspan x="298" y="293.9">not understand</tspan></text>
<line x1="298" y1="314" x2="502" y2="314" stroke="#FEF3C7" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="298" y="341.5">For example</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="298" y="366.8">An unexpected new file</tspan></text>
<line x1="298" y1="408.7" x2="502" y2="408.7" stroke="#FEF3C7" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="298" y="436.2">You say</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="298" y="461.5">“What is this line</tspan><tspan x="298" y="483.9">for?”</tspan></text>
