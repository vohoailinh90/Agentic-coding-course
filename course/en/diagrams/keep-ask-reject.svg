<path d="M536,106.3 a20,20 0 0 1 20,-20 h196 a20,20 0 0 1 20,20 v107.7 h-236 z" fill="#E11D48"/>
<circle cx="654" cy="138.3" r="26" fill="#E11D48"/>
<circle cx="654" cy="138.3" r="23" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="654" y="148.1" font-size="27.3" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">❌</text>
<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="654" y="191.3">Reject</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="552" y="241.5">When</tspan></text>
<text font-size="19" fill="#E11D48" text-anchor="start" font-weight="700"><tspan x="552" y="268.8">It touches what</tspan><tspan x="552" y="293.9">you did not ask for</tspan></text>
<line x1="552" y1="314" x2="756" y2="314" stroke="#FFE4E6" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="552" y="341.5">For example</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="552" y="366.8">A task deleted from</tspan><tspan x="552" y="389.2">the list</tspan></text>
<line x1="552" y1="408.7" x2="756" y2="408.7" stroke="#FFE4E6" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="552" y="436.2">You say</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="552" y="461.5">Reject and say why</tspan></text>
