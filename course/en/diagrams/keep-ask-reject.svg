<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 614" width="800" height="614" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">After the Diff: Keep, Ask or Reject?</title>
<desc id="desc">Keep — When: Right task, right place, small; For example: Only the title line changed; You say: Accept. Ask — When: Something you do not understand; For example: An unexpected new file; You say: “What is this line for?”. Reject — When: It touches what you did not ask for; For example: A task deleted from the list; You say: Reject and say why. A small request with a big diff is a sign to read closely.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
<rect x="1" y="1" width="798" height="612" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="760" cy="36" r="90" fill="#7C3AED" fill-opacity="0.06"/>
<circle cx="46" cy="584" r="110" fill="#2563EB" fill-opacity="0.05"/>
<text font-size="29" fill="#0F172A" text-anchor="middle" font-weight="700"><tspan x="400" y="55">After the Diff: Keep, Ask or Reject?</tspan></text>
<g>
<rect x="28" y="86.3" width="236" height="425.1" rx="20" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
<path d="M28,106.3 a20,20 0 0 1 20,-20 h196 a20,20 0 0 1 20,20 v107.7 h-236 z" fill="#059669"/>
