<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 685" width="800" height="685" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">Prompt, RAG, Fine-Tuning: What Changes?</title>
<desc id="desc">Prompt — What changes: What you tell it; Good for: Task, format, tone; Effort: Least; When facts change: Edit the prompt. RAG — What changes: What it reads; Good for: Your own,
changing facts; Effort: Medium: documents and search; When facts change: Update the documents. Fine-tuning — What changes: The model itself; Good for: A steady style or skill; Effort: Most: data and training; When facts change: Retrain. Try prompting, then RAG, then fine-tuning — and stop when it is good enough.</desc>
