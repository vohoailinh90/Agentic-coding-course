<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 726" width="800" height="726" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">The Next-Token Prediction Cycle</title>
<desc id="desc">Read the text so far → Predict one token → Add that token. Each new token becomes context for the next prediction.</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient><marker id="arrow-cycle" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs>
<rect x="1" y="1" width="798" height="724" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="760" cy="36" r="90" fill="#7C3AED" fill-opacity="0.06"/>
<circle cx="46" cy="696" r="110" fill="#2563EB" fill-opacity="0.05"/>
<text font-size="29" fill="#0F172A" text-anchor="middle" font-weight="700"><tspan x="400" y="55">The Next-Token Prediction Cycle</tspan></text>
<path d="M508.2,186.7 A210,210 0 0 1 608,395.9" fill="none" stroke="#D97706" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="544.1" y="249.6" width="148.7" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="618.4" y="267.1">find a continuation</tspan></text>
<path d="M508.2,546.7 A210,210 0 0 1 273.6,534.4" fill="none" stroke="#D97706" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="356.6" y="595.5" width="61.5" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="387.3" y="613">select</tspan></text>
<path d="M193.9,406.8 A210,210 0 0 1 291.8,186.7" fill="none" stroke="#D97706" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="134.4" y="255.4" width="89" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="178.9" y="272.9">read again</tspan></text>
<g class="pulse">
<circle cx="400" cy="366.7" r="78" fill="#D97706"/>
<circle cx="400" cy="366.7" r="70" fill="#FFFFFF" fill-opacity="0.14"/>
<text x="400" y="358.7" font-size="34" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🔁</text>
<text font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="400" y="388.7">Repeat to</tspan><tspan x="400" y="409.8">make text</tspan></text>
</g>
<rect x="302" y="92.3" width="196" height="128.8" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<circle cx="400" cy="128.3" r="22" fill="#2563EB"/>
<circle cx="400" cy="128.3" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="400" y="136.6" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">👀</text>
<circle cx="320" cy="110.3" r="12" fill="#1E3A8A"/>
<text x="320" y="115.3" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text font-size="18.5" fill="#1E3A8A" text-anchor="middle" font-weight="700"><tspan x="400" y="176.8">Read the text so</tspan><tspan x="400" y="201.2">far</tspan></text>
<rect x="483.9" y="407.3" width="196" height="128.8" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<circle cx="581.9" cy="443.3" r="22" fill="#7C3AED"/>
<circle cx="581.9" cy="443.3" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="581.9" y="451.6" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🧩</text>
<circle cx="501.9" cy="425.3" r="12" fill="#4C1D95"/>
<text x="501.9" y="430.3" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text font-size="18.5" fill="#4C1D95" text-anchor="middle" font-weight="700"><tspan x="581.9" y="491.8">Predict one</tspan><tspan x="581.9" y="516.2">token</tspan></text>
<rect x="120.1" y="419.5" width="196" height="104.4" rx="18" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<circle cx="218.1" cy="455.5" r="22" fill="#059669"/>
<circle cx="218.1" cy="455.5" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="218.1" y="463.8" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">➕</text>
<circle cx="138.1" cy="437.5" r="12" fill="#064E3B"/>
<text x="138.1" y="442.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text font-size="18.5" fill="#064E3B" text-anchor="middle" font-weight="700"><tspan x="218.1" y="504">Add that token</tspan></text>
<rect x="28" y="647.3" width="744" height="49.8" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text font-size="18" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="678.3">💡 Each new token becomes context for the next prediction.</tspan></text>
</svg>
