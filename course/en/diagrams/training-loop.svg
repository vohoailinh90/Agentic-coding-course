<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 796" width="800" height="796" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">The Training Loop</title>
<desc id="desc">Make a guess → Compare with the answer → Nudge the numbers. Nobody writes the model&#x27;s rules; the patterns end up in its numbers.</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient><marker id="arrow-cycle" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker></defs>
<rect x="1" y="1" width="798" height="794" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="760" cy="36" r="90" fill="#7C3AED" fill-opacity="0.06"/>
<circle cx="46" cy="766" r="110" fill="#2563EB" fill-opacity="0.05"/>
<text font-size="29" fill="#0F172A" text-anchor="middle" font-weight="700"><tspan x="400" y="55">The Training Loop</tspan></text>
<text font-size="17" fill="#475569" text-anchor="middle"><tspan x="400" y="85.3">Supervised learning: repeated over many examples with answers</tspan></text>
<path d="M510.7,223.4 A215,215 0 0 1 614.2,426.5" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="583.4" y="282.7" width="73.3" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="620.1" y="300.2">check it</tspan></text>
<path d="M490.9,602.6 A215,215 0 0 1 323,608.4" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="364.1" y="641.7" width="89" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="408.6" y="659.2">correct it</tspan></text>
<path d="M185.3,419 A215,215 0 0 1 289.3,223.4" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="139" y="278.9" width="85.8" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="181.9" y="296.4">next time</tspan></text>
<g class="pulse">
<circle cx="400" cy="407.7" r="78" fill="#4F46E5"/>
<circle cx="400" cy="407.7" r="70" fill="#FFFFFF" fill-opacity="0.14"/>
<text x="400" y="399.7" font-size="34" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🔁</text>
<text font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="400" y="429.7">Repeat many</tspan><tspan x="400" y="450.9">times</tspan></text>
</g>
<rect x="302" y="118.7" width="196" height="148" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<circle cx="400" cy="154.7" r="22" fill="#2563EB"/>
<circle cx="400" cy="154.7" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="400" y="163" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🎯</text>
<circle cx="320" cy="136.7" r="12" fill="#1E3A8A"/>
<text x="320" y="141.7" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text font-size="18.5" fill="#1E3A8A" text-anchor="middle" font-weight="700"><tspan x="400" y="203.2">Make a guess</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="400" y="228.1">with its current</tspan><tspan x="400" y="247.9">numbers</tspan></text>
<rect x="488.2" y="438.9" width="196" height="152.6" rx="18" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<circle cx="586.2" cy="474.9" r="22" fill="#059669"/>
<circle cx="586.2" cy="474.9" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="586.2" y="483.2" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">✅</text>
<circle cx="506.2" cy="456.9" r="12" fill="#064E3B"/>
<text x="506.2" y="461.9" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text font-size="18.5" fill="#064E3B" text-anchor="middle" font-weight="700"><tspan x="586.2" y="523.4">Compare with</tspan><tspan x="586.2" y="547.8">the answer</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="586.2" y="572.8">how far off?</tspan></text>
<rect x="115.8" y="429" width="196" height="172.4" rx="18" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
<circle cx="213.8" cy="465" r="22" fill="#D97706"/>
<circle cx="213.8" cy="465" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="213.8" y="473.3" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🔧</text>
<circle cx="133.8" cy="447" r="12" fill="#78350F"/>
<text x="133.8" y="452" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text font-size="18.5" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="213.8" y="513.5">Nudge the</tspan><tspan x="213.8" y="537.9">numbers</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="213.8" y="562.9">so the next guess is</tspan><tspan x="213.8" y="582.7">closer</tspan></text>
<rect x="28" y="693.5" width="744" height="73.5" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text font-size="18" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="724.5">💡 Nobody writes the model&#x27;s rules; the patterns end up in its</tspan><tspan x="400" y="748.2">numbers.</tspan></text>
</svg>
