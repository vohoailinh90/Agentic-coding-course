<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 551" width="800" height="551" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">Recap: Traditional vs Agentic Coding</title>
<desc id="desc">1. The loop of the craft — Write, run,
read errors, fix; 2. Traditional:
you are the loop — Line by line; 3. Agentic:
the agent runs it — You set the goal,
review the evidence; 4. Give it a check — Or you catch
every mistake; 5. The foundations stay — Tests, Git, reviews,
responsibility. Less typing, but clearer goals and closer checks.</desc>
