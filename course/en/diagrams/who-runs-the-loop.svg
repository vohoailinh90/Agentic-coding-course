<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 732" width="800" height="732" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">Who Runs the Loop?</title>
<desc id="desc">Traditional — Who writes the code: You,
line by line; Who runs, reads errors, fixes: You; Your main job: Typing,
hunting errors; The bottleneck: Typing speed,
syntax memory. Agentic — Who writes the code: The agent; Who runs, reads errors, fixes: The agent,
in its loop; Your main job: Stating the goal,
reviewing evidence; The bottleneck: Vague requests,
no check to run. The agent runs the loop;
you set the goal and check the result.</desc>
