<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 619" width="800" height="619" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">Three Levels of AI: Who Does the Steps?</title>
<desc id="desc">Chatbot — You give it: A question; What it does: Answers in text; Who does the steps?: You. AI assistant (copilot) — You give it: Your work in progress; What it does: Suggests inside your tools; Who does the steps?: You, with suggestions. AI agent — You give it: A goal; What it does: Plans, acts, checks its own work; Who does the steps?: The AI — you supervise. A chatbot answers — an agent acts.</desc>
