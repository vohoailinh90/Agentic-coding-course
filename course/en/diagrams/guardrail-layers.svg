<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 591" width="800" height="591" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">Advice, Permissions and Hooks</title>
<desc id="desc">Advice — Who enforces it: The model; Can it be forgotten?: Yes — misread
or forgotten; Use it for: Conventions,
how to work. Permissions — Who enforces it: The tool; Can it be forgotten?: No — checked
every time; Use it for: Allow, ask,
deny. Hooks — Who enforces it: The tool; Can it be forgotten?: No — always
runs; Use it for: Block, check,
notify. What must never happen needs a lock, not just advice.</desc>
