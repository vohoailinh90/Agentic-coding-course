<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 571" width="800" height="571" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">Recap: The Context Window</title>
<desc id="desc">1. Working memory — Everything the agent can see right now; 2. Everything takes space — Messages, files read, command output; 3. Too full, worse results — Forgets early instructions, more mistakes; 4. One task per session — New, unrelated task? New session; 5. Write what matters to a file — The agent can read it next session. A little of the right context beats a lot of clutter.</desc>
