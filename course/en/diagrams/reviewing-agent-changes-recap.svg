<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 531" width="800" height="531" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">Recap: Reading a Diff</title>
<desc id="desc">1. Which files changed? — Are they the ones you expected; 2. Big or small? — A small task with a big diff is odd; 3. Read what you understand — Text, numbers, labels; 4. Look for red flags — Deleted lines, new files, passwords; 5. Keep, ask or reject — And say why. You do not need to understand every line to review — you need to know where to look.</desc>
