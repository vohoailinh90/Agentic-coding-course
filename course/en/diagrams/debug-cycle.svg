<text font-size="18.5" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="523.4" y="580.8">Guess the</tspan><tspan x="523.4" y="605.2">cause</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="523.4" y="630.1">one hypothesis</tspan></text>
