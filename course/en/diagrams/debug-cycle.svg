<text x="209.6" y="509.4" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text font-size="18.5" fill="#7C2D12" text-anchor="middle" font-weight="700"><tspan x="276.6" y="570.9">Change one</tspan><tspan x="276.6" y="595.3">thing</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="276.6" y="620.2">one change at a</tspan><tspan x="276.6" y="640">time</tspan></text>
