<title id="title">Recap: Retrospective and Evidence Pack</title>
<desc id="desc">1. Done means others
can check it — Not just
when it runs; 2. Four questions — And exactly one thing
to change next time; 3. Evidence pack — Spec, before/after,
checks, limits; 4. Every line
has evidence — The agent drafts,
you verify; 5. The stranger test — A new session with only
the file can rerun it. Finish it, then show it was done right.</desc>
