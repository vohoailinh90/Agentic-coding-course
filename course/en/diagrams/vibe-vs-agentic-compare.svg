<line x1="448" y1="308.7" x2="756" y2="308.7" stroke="#D1FAE5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="448" y="336.2">Who checks the result</tspan></text>
<text font-size="19" fill="#059669" text-anchor="start" font-weight="700"><tspan x="448" y="363.5">The check,</tspan><tspan x="448" y="388.6">then your review</tspan></text>
<line x1="448" y1="408.7" x2="756" y2="408.7" stroke="#D1FAE5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="448" y="436.2">When it breaks</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="448" y="461.5">Re-check</tspan><tspan x="448" y="483.9">until it passes</tspan></text>
<line x1="448" y1="503.4" x2="756" y2="503.4" stroke="#D1FAE5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="448" y="530.9">Good for</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="448" y="556.2">Things people</tspan><tspan x="448" y="578.6">rely on</tspan></text>
</g>
<circle cx="400" cy="158.1" r="25" fill="#0F172A"/>
<text x="400" y="164.1" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">VS</text>
<rect x="28" y="630.1" width="744" height="49.8" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text font-size="18" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="661.1">💡 Same tool; the difference is whether anyone checks the result.</tspan></text>
