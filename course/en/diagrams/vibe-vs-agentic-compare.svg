<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="241.5">What you give</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="266.8">One wish</tspan></text>
<line x1="44" y1="308.7" x2="352" y2="308.7" stroke="#FFE4E6" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="336.2">Who checks the result</tspan></text>
<text font-size="19" fill="#E11D48" text-anchor="start" font-weight="700"><tspan x="44" y="363.5">No one —</tspan><tspan x="44" y="388.6">&quot;seems to work&quot;</tspan></text>
<line x1="44" y1="408.7" x2="352" y2="408.7" stroke="#FFE4E6" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="436.2">When it breaks</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="461.5">Paste the error,</tspan><tspan x="44" y="483.9">hope it works</tspan></text>
<line x1="44" y1="503.4" x2="352" y2="503.4" stroke="#FFE4E6" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="530.9">Good for</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="556.2">Throwaway</tspan><tspan x="44" y="578.6">experiments</tspan></text>
</g>
<g class="pulse">
<rect x="432" y="86.3" width="340" height="519.8" rx="20" fill="#ECFDF5" stroke="#059669" stroke-width="3.5"/>
<path d="M432,106.3 a20,20 0 0 1 20,-20 h300 a20,20 0 0 1 20,20 v107.7 h-340 z" fill="#059669"/>
<circle cx="602" cy="138.3" r="26" fill="#059669"/>
<circle cx="602" cy="138.3" r="23" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="602" y="148.1" font-size="27.3" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🤖</text>
<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="602" y="191.3">Agentic coding</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="448" y="241.5">What you give</tspan></text>
