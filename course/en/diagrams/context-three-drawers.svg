<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 614" width="800" height="614" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">Three Drawers of Context</title>
<desc id="desc">Always — What: A short
instruction file; When it goes in: Start of
every session; Example: &quot;Don&#x27;t delete
files&quot;. When needed — What: Paths to
documents; When it goes in: When the task
needs it; Example: Report template,
made-up data. Never — What: Irrelevant, huge,
secret; When it goes in: Not at all; Example: Passwords,
real data. The right information at the right time, not the most.</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
