<title id="title">One Sentence, Three Languages</title>
<desc id="desc">Vietnamese — Characters: 41; Tokens: 13; How it splits: “sếp” → s + ếp. English — Characters: 44; Tokens: 10; How it splits: One token per word. Japanese — Characters: 19; Tokens: 17; How it splits: Nearly one token
per character. Same idea, different token count:
it depends on the language and the tokenizer.</desc>
