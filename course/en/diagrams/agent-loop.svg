<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 721" width="800" height="721" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">The Agent Loop</title>
<desc id="desc">Think → Act → Observe. You set the goal and check the final result.</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient><marker id="arrow-cycle" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker></defs>
<rect x="1" y="1" width="798" height="719" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="760" cy="36" r="90" fill="#7C3AED" fill-opacity="0.06"/>
<circle cx="46" cy="691" r="110" fill="#2563EB" fill-opacity="0.05"/>
<text font-size="29" fill="#0F172A" text-anchor="middle" font-weight="700"><tspan x="400" y="55">The Agent Loop</tspan></text>
<text font-size="17" fill="#475569" text-anchor="middle"><tspan x="400" y="85.3">It repeats until the goal is met — or it needs to ask you</tspan></text>
<path d="M508.7,228.1 A185,185 0 0 1 584.3,393.9" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="550.6" y="274" width="97.4" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="599.3" y="291.5">picks a tool</tspan></text>
<path d="M478.2,545.4 A185,185 0 0 1 321.8,545.4" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="345.6" y="583.8" width="108.7" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="400" y="601.3">gets a result</tspan></text>
<path d="M215.7,393.9 A185,185 0 0 1 291.3,228.1" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-cycle)"/>
<rect x="123.8" y="274" width="153.8" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="200.7" y="291.5">not done → go again</tspan></text>
<g class="pulse">
<circle cx="400" cy="377.7" r="78" fill="#4F46E5"/>
<circle cx="400" cy="377.7" r="70" fill="#FFFFFF" fill-opacity="0.14"/>
<text x="400" y="369.7" font-size="34" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🤖</text>
<text font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="400" y="399.7">AI agent</tspan></text>
</g>
<rect x="302" y="118.7" width="196" height="148" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<circle cx="400" cy="154.7" r="22" fill="#7C3AED"/>
<circle cx="400" cy="154.7" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="400" y="163" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🧠</text>
<circle cx="320" cy="136.7" r="12" fill="#4C1D95"/>
<text x="320" y="141.7" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text font-size="18.5" fill="#4C1D95" text-anchor="middle" font-weight="700"><tspan x="400" y="203.2">Think</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="400" y="228.1">what is the next</tspan><tspan x="400" y="247.9">step?</tspan></text>
<rect x="462.2" y="406.1" width="196" height="128.2" rx="18" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
<circle cx="560.2" cy="442.1" r="22" fill="#D97706"/>
<circle cx="560.2" cy="442.1" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="560.2" y="450.4" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🔧</text>
<circle cx="480.2" cy="424.1" r="12" fill="#78350F"/>
<text x="480.2" y="429.1" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text font-size="18.5" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="560.2" y="490.6">Act</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="560.2" y="515.5">uses a real tool</tspan></text>
<rect x="141.8" y="406.1" width="196" height="128.2" rx="18" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
<circle cx="239.8" cy="442.1" r="22" fill="#0D9488"/>
<circle cx="239.8" cy="442.1" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="239.8" y="450.4" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">👀</text>
<circle cx="159.8" cy="424.1" r="12" fill="#134E4A"/>
<text x="159.8" y="429.1" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text font-size="18.5" fill="#134E4A" text-anchor="middle" font-weight="700"><tspan x="239.8" y="490.6">Observe</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="239.8" y="515.5">did it work?</tspan></text>
<rect x="28" y="642.7" width="744" height="49.8" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text font-size="18" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="673.7">💡 You set the goal and check the final result.</tspan></text>
</svg>
