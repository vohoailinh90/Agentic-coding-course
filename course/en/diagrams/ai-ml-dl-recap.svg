<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 555" width="800" height="555" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">Recap: The AI Family Tree</title>
<desc id="desc">1. Five words, one family — Each level sits inside the one above; 2. Written rules are not learning — Rules someone wrote, or learned from examples?; 3. Deep learning uses many layers — Behind modern image, speech and text AI; 4. Generative AI makes new things — An LLM does it for text; 5. An agent&#x27;s brain is an LLM — Fluent, and still fallible. When you hear &quot;AI&quot;, ask: written rules or learned from data? Sorting things, or making new ones?</desc>
