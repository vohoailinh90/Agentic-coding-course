<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 637" width="800" height="637" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">Before You Allow a Command</title>
<desc id="desc">Only looks — Examples: pwd, ls, cat, git status; What it does: Reads, changes nothing; What you do: Usually allow. Changes things — Examples: mkdir, mv, rm, pip install; What it does: Creates, moves, deletes, installs; What you do: Ask why; inside ai-practice?. Crosses a line — Examples: Changes a work PC&#x27;s rules; What it does: Breaks rules, leaks real data; What you do: Refuse. Never allow a command you do not understand — ask the agent what it does first.</desc>
