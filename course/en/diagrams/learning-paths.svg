<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 665" width="800" height="665" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">Choose Your Way Through the Course</title>
<desc id="desc">The minimum path — Covers: The lessons marked ⭐; Good when: You want real results soon; You make: A personal page, an automated report. The whole course — Covers: Every core lesson, in order; Good when: You want a solid understanding; You make: Also workflows and automatic checks. Extra, when you need it — Covers: Optional and advanced units; Good when: You are curious or have a need; You make: Whatever your project needs. Going slowly is fine — as long as every session ends with a product and evidence.</desc>
