<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 687" width="800" height="687" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">Answer at Once or Think First?</title>
<desc id="desc">Answer at once — How it works: Writes the answer directly; Time: Fast; Tokens: The answer only; Good for: Short questions,
rewording a sentence. Think first — How it works: Drafts the steps,
then answers; Time: Slower; Tokens: Plus the thinking; Good for: Multi-step problems,
code, planning. Thinking first helps with multi-step work,
but it costs time and tokens.</desc>
