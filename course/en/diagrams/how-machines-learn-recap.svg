<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 575" width="800" height="575" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">Recap: How Machines &quot;Learn&quot;</title>
<desc id="desc">1. Supervised: examples + answers — They need to be
right and varied; 2. Training: guess, compare, adjust — Repeated many,
many times; 3. The model: learned numbers — Used to predict new cases; 4. Test on data it has not seen — Memorizing is not learning; 5. LLMs: guess the next token — It does not learn while you chat. A model is only as good as its data — and it does not change while you chat with it.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
