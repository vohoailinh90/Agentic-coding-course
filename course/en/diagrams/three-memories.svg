<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 665" width="800" height="665" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">Where Does an Agent &quot;Remember&quot;?</title>
<desc id="desc">What it learned — What it holds: What it learned in training; How long it lasts: Frozen at a date, may be outdated; What you do: Bring in new facts when needed. The context window — What it holds: Messages, files read, command output; How long it lasts: This session only; worse when full; What you do: One task per session, kept lean. Files you keep — What it holds: Specs, notes, conventions; How long it lasts: Lasting, across sessions; What you do: Write what matters to a file. Anything that must be remembered goes in a file — not only in the chat.</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
