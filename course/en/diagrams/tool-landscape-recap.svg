<title id="title">Recap: Choose a Tool by Environment</title>
<desc id="desc">1. Four shapes — Chat, editor,
local and cloud agents; 2. Where are the files?
What can you install? — The tool must reach them; 3. Which data
is allowed? — Company data:
approved tools only; 4. Hype talks
about models — Test on a small task
of your own; 5. Skills travel — Specs, checks,
reviews, Git. Your environment picks the tool; your skills go with you.</desc>
