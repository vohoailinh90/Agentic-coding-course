<title id="title">Recap: Automating a Monthly Report</title>
<desc id="desc">1. Know the right answer first — Work out at least one number yourself; 2. A spec with numbers to match — Totals by product and branch; 3. Runs again — Next month, just swap the data file; 4. A check you have seen fail — Against the answers, broken on purpose; 5. Practise on made-up data — Real data only where your company allows. Automation earns trust when you know the right answer in advance.</desc>
