<title id="title">Recap: Five Jobs of a Lead</title>
<desc id="desc">1. The goal and why — What, for whom, what for; 2. What done means — Criteria you can check; 3. Boundaries — Safe, ask first, never; 4. Check at key moments — The goal, the changes, the result; 5. Own the result — The agent works; you sign off. The less you type, the more clearly you must think and check.</desc>
