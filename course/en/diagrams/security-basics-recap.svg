<title id="title">Recap: Keep Secrets Out of Public Places</title>
<desc id="desc">1. A key is a password — It may grant access as you; 2. Store outside code — Environment or ignored file; 3. Never share — No chat, screenshot or public repo; 4. Revoke after a leak — Replace and inspect usage. Deleting one line does not disable a secret that was copied.</desc>
