<text font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="700"><tspan x="198" y="191.3">Vibe coding</tspan></text>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="241.5">Do you read the changes?</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="266.8">No</tspan></text>
<line x1="44" y1="286.3" x2="352" y2="286.3" stroke="#FFEDD5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="313.8">You know it is done when</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="339.1">It seems</tspan><tspan x="44" y="361.5">to work</tspan></text>
<line x1="44" y1="381" x2="352" y2="381" stroke="#FFEDD5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="408.5">When there is an error</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="44" y="433.8">Paste it to the AI,</tspan><tspan x="44" y="456.2">take the fix</tspan></text>
<line x1="44" y1="475.7" x2="352" y2="475.7" stroke="#FFEDD5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="44" y="503.2">Good for</tspan></text>
<text font-size="19" fill="#EA580C" text-anchor="start" font-weight="700"><tspan x="44" y="530.5">Throwaway</tspan><tspan x="44" y="555.6">experiments</tspan></text>
</g>
