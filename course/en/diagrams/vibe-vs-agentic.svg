<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 710" width="800" height="710" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">Vibe Coding or Agentic Coding?</title>
<desc id="desc">Vibe coding — Do you read the changes?: No; You know it is done when: It seems
to work; When there is an error: Paste it to the AI,
take the fix; Good for: Throwaway
experiments. Agentic coding — Do you read the changes?: Yes; You know it is done when: Criteria written first
all pass; When there is an error: Find the cause,
check again; Good for: Work someone
relies on. The difference is what you do with the result,
not the tool.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient></defs>
<rect x="1" y="1" width="798" height="708" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="760" cy="36" r="90" fill="#7C3AED" fill-opacity="0.06"/>
<circle cx="46" cy="680" r="110" fill="#2563EB" fill-opacity="0.05"/>
