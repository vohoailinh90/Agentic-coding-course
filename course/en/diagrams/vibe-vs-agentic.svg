<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="448" y="408.5">When there is an error</tspan></text>
<text font-size="17" fill="#0F172A" text-anchor="start"><tspan x="448" y="433.8">Find the cause,</tspan><tspan x="448" y="456.2">check again</tspan></text>
<line x1="448" y1="475.7" x2="756" y2="475.7" stroke="#D1FAE5" stroke-width="2"/>
<text font-size="13.5" fill="#64748B" text-anchor="start" font-weight="700"><tspan x="448" y="503.2">Good for</tspan></text>
<text font-size="19" fill="#059669" text-anchor="start" font-weight="700"><tspan x="448" y="530.5">Work someone</tspan><tspan x="448" y="555.6">relies on</tspan></text>
</g>
<circle cx="400" cy="158.1" r="25" fill="#0F172A"/>
<text x="400" y="164.1" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">VS</text>
<rect x="28" y="607.6" width="744" height="73.5" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text font-size="18" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="638.6">💡 The difference is what you do with the result,</tspan><tspan x="400" y="662.4">not the tool.</tspan></text>
