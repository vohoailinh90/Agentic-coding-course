<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 527" width="800" height="527" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">Git Is Your Safety Net When an Agent Works</title>
<desc id="desc">Commit first → The agent works → Look at git diff → Keep or go back. A commit before every big task means there is always a way back.</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient><marker id="arrow-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="798" height="525" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="760" cy="36" r="90" fill="#7C3AED" fill-opacity="0.06"/>
<circle cx="46" cy="497" r="110" fill="#2563EB" fill-opacity="0.05"/>
<text font-size="29" fill="#0F172A" text-anchor="middle" font-weight="700"><tspan x="400" y="55">Git Is Your Safety Net When an Agent</tspan><tspan x="400" y="93.3">Works</tspan></text>
<text font-size="17" fill="#475569" text-anchor="middle"><tspan x="400" y="123.6">Snapshot first, look at the difference, then decide</tspan></text>
<rect x="28" y="151" width="142.5" height="212" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<circle cx="99.2" cy="187" r="22" fill="#2563EB"/>
<circle cx="99.2" cy="187" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="99.2" y="195.3" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">📸</text>
<circle cx="46" cy="169" r="12" fill="#1E3A8A"/>
<text x="46" y="174" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text font-size="18.5" fill="#1E3A8A" text-anchor="middle" font-weight="700"><tspan x="99.2" y="235.5">Commit</tspan><tspan x="99.2" y="259.9">first</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="99.2" y="284.8">A snapshot of</tspan><tspan x="99.2" y="304.6">the whole</tspan><tspan x="99.2" y="324.4">project, with a</tspan><tspan x="99.2" y="344.2">message</tspan></text>
<line x1="176.5" y1="257" x2="222.5" y2="257" stroke="#475569" stroke-width="3" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-flow)"/>
<rect x="228.5" y="151" width="142.5" height="212" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<circle cx="299.8" cy="187" r="22" fill="#7C3AED"/>
<circle cx="299.8" cy="187" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="299.8" y="195.3" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🤖</text>
<circle cx="246.5" cy="169" r="12" fill="#4C1D95"/>
<text x="246.5" y="174" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text font-size="18.5" fill="#4C1D95" text-anchor="middle" font-weight="700"><tspan x="299.8" y="235.5">The agent</tspan><tspan x="299.8" y="259.9">works</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="299.8" y="284.8">However many</tspan><tspan x="299.8" y="304.6">files it</tspan><tspan x="299.8" y="324.4">changes</tspan></text>
<line x1="377" y1="257" x2="423" y2="257" stroke="#475569" stroke-width="3" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-flow)"/>
<rect x="429" y="151" width="142.5" height="212" rx="18" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
<circle cx="500.2" cy="187" r="22" fill="#0D9488"/>
<circle cx="500.2" cy="187" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="500.2" y="195.3" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🔍</text>
<circle cx="447" cy="169" r="12" fill="#134E4A"/>
<text x="447" y="174" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text font-size="18.5" fill="#134E4A" text-anchor="middle" font-weight="700"><tspan x="500.2" y="235.5">Look at git</tspan><tspan x="500.2" y="259.9">diff</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="500.2" y="284.8">What changed</tspan><tspan x="500.2" y="304.6">since the last</tspan><tspan x="500.2" y="324.4">commit</tspan></text>
<line x1="577.5" y1="257" x2="623.5" y2="257" stroke="#475569" stroke-width="3" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-flow)"/>
<rect x="629.5" y="151" width="142.5" height="212" rx="18" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<circle cx="700.8" cy="187" r="22" fill="#059669"/>
<circle cx="700.8" cy="187" r="19" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="700.8" y="195.3" font-size="23.1" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🛟</text>
<circle cx="647.5" cy="169" r="12" fill="#064E3B"/>
<text x="647.5" y="174" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text font-size="18.5" fill="#064E3B" text-anchor="middle" font-weight="700"><tspan x="700.8" y="235.5">Keep or go</tspan><tspan x="700.8" y="259.9">back</tspan></text>
<text font-size="15" fill="#475569" text-anchor="middle"><tspan x="700.8" y="284.8">A new commit,</tspan><tspan x="700.8" y="304.6">or back to the</tspan><tspan x="700.8" y="324.4">snapshot</tspan></text>
<rect x="149.1" y="375" width="100.9" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="199.5" y="392.5">a safe point</tspan></text>
<rect x="363.6" y="375" width="72.8" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="400" y="392.5">changes</tspan></text>
<rect x="569.8" y="375" width="61.5" height="25.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text font-size="13.5" fill="#475569" text-anchor="middle"><tspan x="600.5" y="392.5">decide</tspan></text>
<rect x="28" y="424.9" width="744" height="73.5" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text font-size="18" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="455.9">💡 A commit before every big task means there is always a way</tspan><tspan x="400" y="479.6">back.</tspan></text>
</svg>
