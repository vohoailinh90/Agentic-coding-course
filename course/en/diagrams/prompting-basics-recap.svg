<title id="title">Recap: A Clear Prompt Makes Results Checkable</title>
<desc id="desc">1. Give context — Situation, audience, data; 2. State task and format — Verb, length, example; 3. Mark unknowns — Do not invent facts; 4. Check it yourself — Compare with source and criteria; 5. Use invented data — Inside ai-practice. A good prompt reduces guessing; the user still checks.</desc>
