<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 737" width="800" height="737" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">Three Ways to Practise with an Agent</title>
<desc id="desc">Personal computer — Install: One agent app; Where the files live: On your computer; Good when: You have your own computer; Watch out: Work only in ai-practice. Browser (cloud) — Install: Nothing to install; Where the files live: An online code repository; Good when: You cannot install software; Watch out: Needs a GitHub account. Work computer — Install: Approved tools only; Where the files live: As company rules say; Good when: Your company allows it; Watch out: Exercises use made-up data. Not sure it is allowed? Ask first — or learn on your own computer.</desc>
<style>
