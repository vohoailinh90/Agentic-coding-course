<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 555" width="800" height="555" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">Recap: The Four Building Blocks</title>
<desc id="desc">1. A variable holds a named value — Change it once, it changes everywhere; 2. A function is a named job — Takes input, returns a result, reusable; 3. A condition picks a branch — Where bugs hide: &gt; or &gt;= ?; 4. A loop repeats for each item — It stops when the list ends; 5. Direct by name — Change a variable, add a condition. You do not need to write code — you need to spot the four blocks and name them.</desc>
