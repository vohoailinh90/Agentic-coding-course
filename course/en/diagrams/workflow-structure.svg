<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 689" width="800" height="689" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">Add Structure by Risk</title>
<desc id="desc">Just do it — Use it when: One-sentence
change; Guards against: Wasted
ceremony; Extra cost: Almost none. Plan first — Use it when: Unclear approach,
many files; Guards against: Solving the
wrong problem; Extra cost: A few minutes&#x27; reading. Tests first — Use it when: Right answers
known ahead; Guards against: &quot;Looks right&quot;; Extra cost: Writing a
few cases. Separate review — Use it when: Mistakes
are costly; Guards against: The author&#x27;s
blind spots; Extra cost: A fresh
session. Ask &quot;where could this go wrong?&quot;, then add only what it needs.</desc>
