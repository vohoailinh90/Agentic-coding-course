<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 601" width="800" height="601" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, 'Liberation Sans', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', IPAPGothic, sans-serif" lang="en">
<title id="title">The Three Parts of an Eval</title>
<desc id="desc">Tasks + Trials + Graders = A pass rate. One try is an anecdote; an eval is evidence.</desc>
<style>
.flow { animation: flow 1.4s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes pulse { 50% { transform: scale(1.035); } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient><marker id="arrow-result" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="798" height="599" rx="24" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="760" cy="36" r="90" fill="#7C3AED" fill-opacity="0.06"/>
<circle cx="46" cy="571" r="110" fill="#2563EB" fill-opacity="0.05"/>
<text font-size="29" fill="#0F172A" text-anchor="middle" font-weight="700"><tspan x="400" y="55">The Three Parts of an Eval</tspan></text>
<rect x="28" y="86.3" width="218.7" height="171.3" rx="20" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<circle cx="137.3" cy="130.3" r="28" fill="#2563EB"/>
<circle cx="137.3" cy="130.3" r="25" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="137.3" y="140.9" font-size="29.4" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">📝</text>
<text font-size="20" fill="#1E3A8A" text-anchor="middle" font-weight="700"><tspan x="137.3" y="188.3">Tasks</tspan></text>
<text font-size="15.5" fill="#475569" text-anchor="middle"><tspan x="137.3" y="214.2">input +</tspan><tspan x="137.3" y="234.6">success criteria</tspan></text>
<rect x="290.7" y="86.3" width="218.7" height="171.3" rx="20" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<circle cx="400" cy="130.3" r="28" fill="#4F46E5"/>
<circle cx="400" cy="130.3" r="25" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="400" y="140.9" font-size="29.4" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🔁</text>
<text font-size="20" fill="#312E81" text-anchor="middle" font-weight="700"><tspan x="400" y="188.3">Trials</tspan></text>
<text font-size="15.5" fill="#475569" text-anchor="middle"><tspan x="400" y="214.2">each task</tspan><tspan x="400" y="234.6">several times</tspan></text>
<circle cx="268.7" cy="171.9" r="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<text x="268.7" y="179.9" font-size="24" font-weight="700" fill="#475569" text-anchor="middle">+</text>
<rect x="553.3" y="86.3" width="218.7" height="171.3" rx="20" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
<circle cx="662.7" cy="130.3" r="28" fill="#D97706"/>
<circle cx="662.7" cy="130.3" r="25" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="662.7" y="140.9" font-size="29.4" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">💯</text>
<text font-size="20" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="662.7" y="188.3">Graders</tspan></text>
<text font-size="15.5" fill="#475569" text-anchor="middle"><tspan x="662.7" y="214.2">code, model</tspan><tspan x="662.7" y="234.6">or human</tspan></text>
<circle cx="531.3" cy="171.9" r="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<text x="531.3" y="179.9" font-size="24" font-weight="700" fill="#475569" text-anchor="middle">+</text>
<line x1="400.0" y1="269.6" x2="400.0" y2="315.6" stroke="#475569" stroke-width="3" stroke-dasharray="9 9" class="flow" marker-end="url(#arrow-result)"/>
<circle cx="440" cy="293.6" r="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<text x="440" y="301.6" font-size="24" font-weight="700" fill="#475569" text-anchor="middle">=</text>
<g class="pulse">
<rect x="220" y="327.6" width="360" height="171.3" rx="20" fill="#ECFDF5" stroke="#059669" stroke-width="3.5"/>
<circle cx="400" cy="371.6" r="28" fill="#059669"/>
<circle cx="400" cy="371.6" r="25" fill="#FFFFFF" fill-opacity="0.2"/>
<text x="400" y="382.2" font-size="29.4" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">📊</text>
<text font-size="20" fill="#064E3B" text-anchor="middle" font-weight="700"><tspan x="400" y="429.6">A pass rate</tspan></text>
<text font-size="15.5" fill="#475569" text-anchor="middle"><tspan x="400" y="455.5">a number instead</tspan><tspan x="400" y="476">of a feeling</tspan></text>
</g>
<rect x="28" y="522.9" width="744" height="49.8" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text font-size="18" fill="#78350F" text-anchor="middle" font-weight="700"><tspan x="400" y="553.9">💡 One try is an anecdote; an eval is evidence.</tspan></text>
</svg>
