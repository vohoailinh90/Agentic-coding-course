- label: approved no longer needs the verification fields to be done
  find: '    if status == "approved" and any(value != "done" for value in states.values()):'
  replace: '    if False:'
  test: tests.test_sd101_check.LessonYamlRuleTests.test_approved_with_a_pending_check_is_reported
- label: the learner test no longer counts toward approved
  find: '    states = {"learner_test": meta.get("learner_test")}'
  replace: '    states = {}'
  test: tests.test_sd101_check.LessonYamlRuleTests.test_a_learner_test_that_is_still_pending_blocks_approved
- label: a lesson id that differs from its directory is accepted
