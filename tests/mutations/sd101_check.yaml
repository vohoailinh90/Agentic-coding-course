# Mutation manifest — see scripts/mutation_check.py
#
# A passing test proves nothing on its own. These break each rule of the System Design store checker
# in turn and require the named test to fail. A mutation that SURVIVES means the test guards nothing.

target: scripts/sd101_check.py
note: The checker is what stops ~400 hand-written lessons drifting from the schema in DECISIONS.md and
  what keeps source images out of a public repository. Each entry switches one rule off and names the
  test that must notice.
mutations:
- label: approved no longer needs the verification fields to be done
  find: '    if status == "approved" and any(value != "done" for value in states.values()):'
  replace: '    if False:'
  test: tests.test_sd101_check.LessonYamlRuleTests.test_approved_with_a_pending_check_is_reported
- label: the learner test no longer counts toward approved
  find: '    states = {"learner_test": meta.get("learner_test")}'
  replace: '    states = {}'
  test: tests.test_sd101_check.LessonYamlRuleTests.test_a_learner_test_that_is_still_pending_blocks_approved
- label: a lesson id that differs from its directory is accepted
  find: '    if meta.get("id") != lesson_id:'
  replace: '    if False:'
  test: tests.test_sd101_check.LessonYamlRuleTests.test_an_id_that_is_not_the_directory_name_is_reported
- label: a title that differs from the source map is accepted
  find: '    elif entry is not None and title != entry.get("title_vi"):'
  replace: '    elif False:'
  test: tests.test_sd101_check.LessonYamlRuleTests.test_a_title_that_differs_from_the_source_map_is_reported
- label: a null title that equals a null source map title is accepted
  find: '    if not isinstance(title, str) or not title.strip():'
  replace: '    if False:'
  test: tests.test_sd101_check.LessonYamlRuleTests.test_a_null_title_that_matches_a_null_source_map_title_is_reported
- label: an image evidence entry may lack its digest
  find: '    if not isinstance(item, dict) or set(item) != IMAGE_EVIDENCE_KEYS:'
  replace: '    if not isinstance(item, dict):'
  test: tests.test_sd101_check.LessonYamlRuleTests.test_an_image_evidence_entry_without_a_digest_is_reported
- label: an unclosed code fence is accepted
  find: '    if has_unclosed_fence(text):'
  replace: '    if False:'
  test: tests.test_sd101_check.LessonMarkdownRuleTests.test_an_unclosed_code_fence_is_reported
- label: only backtick fences are recognised as closing a fence
  find: '            if not (closing and set(closing) == {token.markup[0]} and len(closing) >= len(token.markup)):'
  replace: '            if not closing.startswith("```"):'
  test: tests.test_sd101_check.LessonMarkdownRuleTests.test_closed_fences_of_either_marker_and_any_length_are_accepted
- label: a closing fence shorter than the opening one closes it
  find: '            if not (closing and set(closing) == {token.markup[0]} and len(closing) >= len(token.markup)):'
  replace: '            if not (closing and set(closing) == {token.markup[0]}):'
  test: tests.test_sd101_check.LessonMarkdownRuleTests.test_a_closing_fence_shorter_than_the_opening_one_does_not_close_it
- label: a relative link that leads nowhere is accepted
  find: '        if target is not None and not (lesson_dir / target).exists():'
  replace: '        if False:'
  test: tests.test_sd101_check.LessonMarkdownRuleTests.test_a_relative_link_that_does_not_resolve_is_reported
- label: anchors, URLs and mail links are treated as relative paths
  find: '    if destination.startswith(("#", "//")) or SCHEME.match(destination):'
  replace: '    if False:'
  test: tests.test_sd101_check.LessonMarkdownRuleTests.test_anchors_urls_and_mail_links_are_not_relative_links
- label: a fragment or query is kept in the path that must exist
  find: '    return unquote(destination.split("#")[0].split("?")[0]) or None'
  replace: '    return unquote(destination) or None'
  test: tests.test_sd101_check.LessonMarkdownRuleTests.test_a_relative_link_with_a_fragment_or_query_is_checked_by_its_path
- label: a percent-encoded path is not decoded before it is looked up
  find: '    return unquote(destination.split("#")[0].split("?")[0]) or None'
  replace: '    return destination.split("#")[0].split("?")[0] or None'
  test: tests.test_sd101_check.LessonMarkdownRuleTests.test_a_relative_link_with_non_ascii_letters_resolves
- label: the pinned snapshot URL counts wherever it appears in the file, not only as a link
  find: '    if snapshot and snapshot not in link_destinations(text):'
  replace: '    if snapshot and snapshot not in text:'
  test: tests.test_sd101_check.LessonMarkdownRuleTests.test_a_snapshot_url_in_a_code_block_is_not_a_link
- label: an href on a tag other than <a> counts as a link
  find: '        if tag == "a":'
  replace: '        if True:'
  test: tests.test_sd101_check.LessonMarkdownRuleTests.test_href_text_inside_another_attribute_is_not_a_link
- label: a mention of a lesson that has no directory is accepted
  find: '        if mentioned not in lesson_ids:'
  replace: '        if False:'
  test: tests.test_sd101_check.LessonMarkdownRuleTests.test_a_mention_of_a_lesson_without_a_directory_is_reported
- label: the source image host is no longer forbidden
  find: '    if SOURCE_IMAGE_HOST in text.lower():'
  replace: '    if False:'
  test: tests.test_sd101_check.LessonMarkdownRuleTests.test_every_form_of_source_image_embed_is_reported
- label: the source image host check becomes case sensitive
  find: '    if SOURCE_IMAGE_HOST in text.lower():'
  replace: '    if SOURCE_IMAGE_HOST in text:'
  test: tests.test_sd101_check.LessonMarkdownRuleTests.test_every_form_of_source_image_embed_is_reported
- label: a README path anywhere in the file counts as a link
  find: '                for lesson_id in sorted(lesson_ids) if f"lessons/{lesson_id}/lesson.md" not in linked]'
  replace: '                for lesson_id in sorted(lesson_ids) if f"lessons/{lesson_id}/lesson.md" not in text]'
  test: tests.test_sd101_check.ReadmeRuleTests.test_a_readme_path_in_a_comment_a_code_block_or_prose_is_not_a_link
- label: the README is no longer checked at all
  find: '    problems.extend(check_readme(store, lesson_ids))'
  replace: '    pass'
  test: tests.test_sd101_check.ReadmeRuleTests.test_a_lesson_missing_from_the_readme_is_reported
- label: a README status cell is compared as raw text, not as what it shows
  find: '    return re.sub(r"<[^>]+>|[*_`~]", "", cell).strip(" .,;:").lower()'
  replace: '    return cell.strip()'
  test: tests.test_sd101_check.ReadmeRuleTests.test_a_formatted_or_capitalised_status_in_a_readme_row_is_reported
- label: a README status cell is compared case sensitively
  find: '    return re.sub(r"<[^>]+>|[*_`~]", "", cell).strip(" .,;:").lower()'
  replace: '    return re.sub(r"<[^>]+>|[*_`~]", "", cell).strip(" .,;:")'
  test: tests.test_sd101_check.ReadmeRuleTests.test_a_formatted_or_capitalised_status_in_a_readme_row_is_reported
- label: a broken store still exits zero
  find: '    return 1 if problems else 0'
  replace: '    return 0'
  test: tests.test_sd101_check.CommandLineTests.test_a_broken_store_exits_one_and_prints_the_problem
- label: an HTML anchor is no longer recognised as a link
  find: '    return found | set(html_scan(text).hrefs)'
  replace: '    return found'
  test: tests.test_sd101_check.LessonMarkdownRuleTests.test_a_snapshot_given_as_an_html_anchor_is_a_link
- label: Markdown links are no longer recognised as links
  find: '    found = {token.attrGet("href") or "" for token in markdown_tokens(text) if token.type == "link_open"}'
  replace: '    found: set[str] = set()'
  test: tests.test_sd101_check.LessonMarkdownRuleTests.test_a_snapshot_given_as_a_reference_style_link_is_a_link
- label: HTML is scanned with a pattern, so a comment or an attribute value can hold a link
  find: '            scan.feed(token.content)'
  replace: '            scan.hrefs.extend(re.findall(r"href=.?([^\s\"''>]+)", token.content))'
  test: tests.test_sd101_check.LessonMarkdownRuleTests.test_href_text_inside_another_attribute_is_not_a_link
- label: code blocks, code spans and comments are scanned for HTML tags too
  find: '        if token.type in ("html_inline", "html_block"):'
  replace: '        if token.content:'
  test: tests.test_sd101_check.LessonMarkdownRuleTests.test_a_details_tag_in_a_code_block_a_code_span_or_a_comment_is_not_counted
- label: README tables are found by raw lines that start with a pipe
  find: '    if any(plain_cell(cell) in CONTENT_STATUS for cell in table_cells(text)):'
  replace: '    if any(plain_cell(cell) in CONTENT_STATUS for line in text.splitlines() if line.startswith("|") for cell in line.strip("|").split("|")):'
  test: tests.test_sd101_check.ReadmeRuleTests.test_a_table_without_outer_pipes_or_with_an_indented_row_is_still_inspected
- label: a table shown inside a code block is read as a README table
  find: '    if any(plain_cell(cell) in CONTENT_STATUS for cell in table_cells(text)):'
  replace: '    if any(plain_cell(cell) in CONTENT_STATUS for line in text.splitlines() if line.startswith("|") for cell in line.strip("|").split("|")):'
  test: tests.test_sd101_check.ReadmeRuleTests.test_a_table_shown_inside_a_code_block_is_not_a_readme_table
- label: Markdown tables are not parsed
  find: '    for token in MarkdownIt("commonmark").enable("table").parse(text):'
  replace: '    for token in MarkdownIt("commonmark").parse(text):'
  test: tests.test_sd101_check.ReadmeRuleTests.test_a_status_word_in_a_readme_row_is_reported
- label: a README status is no longer looked for in any table cell
  find: '    if any(plain_cell(cell) in CONTENT_STATUS for cell in table_cells(text)):'
  replace: '    if False:'
  test: tests.test_sd101_check.ReadmeRuleTests.test_a_status_word_in_a_readme_row_is_reported
- label: a README link written with ./ no longer counts
  find: '    linked = {posixpath.normpath(target) for target in targets if target}'
  replace: '    linked = {target for target in targets if target}'
  test: tests.test_sd101_check.ReadmeRuleTests.test_a_readme_link_as_an_html_anchor_or_a_reference_or_with_dot_slash_counts
- label: a README link with a fragment, query or percent-encoding no longer counts
