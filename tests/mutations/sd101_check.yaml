# Mutation manifest — see scripts/mutation_check.py
#
# A passing test proves nothing on its own. These break each rule of the System Design store checker
# in turn and require the named test to fail. A mutation that SURVIVES means the test guards nothing.

target: scripts/sd101_check.py
note: The checker is what stops ~400 hand-written lessons drifting from the schema in DECISIONS.md and
  what keeps source images out of a public repository. Each entry switches one rule off and names the
  test that must notice.
mutations:
- label: approved no longer needs the verification fields to be done
  find: '    if status == "approved" and any(value != "done" for value in states.values()):'
  replace: '    if False:'
  test: tests.test_sd101_check.LessonYamlRuleTests.test_approved_with_a_pending_check_is_reported
- label: the learner test no longer counts toward approved
  find: '    states = {"learner_test": meta.get("learner_test")}'
  replace: '    states = {}'
  test: tests.test_sd101_check.LessonYamlRuleTests.test_a_learner_test_that_is_still_pending_blocks_approved
- label: a lesson id that differs from its directory is accepted
  find: '    if meta.get("id") != lesson_id:'
  replace: '    if False:'
  test: tests.test_sd101_check.LessonYamlRuleTests.test_an_id_that_is_not_the_directory_name_is_reported
- label: a title that differs from the source map is accepted
