      The safe half of the REQ-015/REQ-016 pair. `reads-authorization-rule` and `reads-payment-record` are both read-only exempt and must be dropped before override matching, leaving no emitted signals — this is a bounded read using existing patterns, the same shape as REQ-004. Paired with REQ-016, this proves the exemption does not merely fail to escalate everything (a vacuous property); it specifically keeps a harmless read at T1 while REQ-016's new disclosure action still escalates.

  - id: REQ-016
    semantic_hints: {ambiguity: 0, scope: 1, architecture: 0, dependencies: 0, risk: 2, verification: 1}
    raw_score: 4
    signals: [exposes-sensitive-record]
    score_tier: T1
    tier: T2
