    required_agents: [code-reviewer]
    max_agent_invocations: 2
    parallelizable: false
    human_gate: false
    oracle_note: >-
      The dangerous half of the pair, and the regression fixture for the Q3 finding on PR #4's brainstorm round: `reads-authorization-rule`, `reads-payment-record`, `reads-ledger` and `reads-audit-log` are all read-only exempt, but returning those records to a support role across tenants, through an endpoint that adds no new authorization check, is `exposes-sensitive-record` — an action, not a read. Before this signal existed, a classifier that emitted only the exempt reads routed this to T1, the same disclosure hole `exposes-secret`/REQ-013 closed for secrets. Architecture is 0, so the conditional architect does not fire; the security-sensitive override alone lifts a score-4 T1 to T2.

  - id: REQ-017
