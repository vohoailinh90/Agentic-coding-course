  - id: REQ-018
    semantic_hints: {ambiguity: 0, scope: 1, architecture: 1, dependencies: 1, risk: 1, verification: 1}
    raw_score: 5
    signals: [changes-canonical-model, runs-backfill]
    score_tier: T1
    tier: T2
    strategy: main_with_architect_and_reviewer
    required_agents: [architect, code-reviewer]
    max_agent_invocations: 2
    parallelizable: false
    human_gate: false
    oracle_note: >-
      The other half of the OR-semantics pair: architecture is 1, not 2 — this is an additive, backward-compatible field on a canonical model whose ownership stays with the catalog service, matching the rubric's own architecture-1 example — so only the signal arm (`changes-canonical-model`) fires the architect, and `database-or-data-migration` separately lifts a score-5 T1 to T2. A classifier or policy engine that (incorrectly) ANDed the T2 architect's two conditions together would drop the architect here, since architecture never reaches 2.
