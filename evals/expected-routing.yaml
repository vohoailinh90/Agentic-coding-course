  - id: REQ-008
    semantic_hints: {ambiguity: 1, scope: 1, architecture: 1, dependencies: 1, risk: 2, verification: 2}
    raw_score: 8
    signals: [rotates-credential, writes-secret, changes-authentication-flow, executes-irreversible-operation]
    score_tier: T2
    tier: T3
    strategy: main_with_critic_and_reviewer
    required_agents: [architecture-critic, code-reviewer-t3]
    max_agent_invocations: 3
    parallelizable: false
    human_gate: false
    oracle_note: >-
      Immediate invalidation of the old credential is `executes-irreversible-operation`, which raises the tier to T3. The standing human-gate requirement was removed from policy.yaml's irreversible-or-destructive override; completion and merge follow the autonomous policy in CLAUDE.md / docs/claude-to-codex.md §20. Ambiguity is 1, so the conditional requirement-analyst does not fire and the T3 budget stays at the base 3.

  - id: REQ-009
    semantic_hints: {ambiguity: 1, scope: 1, architecture: 1, dependencies: 2, risk: 1, verification: 2}
    raw_score: 8
    signals: [coordinates-distributed-work]
    score_tier: T2
    tier: T2
    strategy: main_with_architect_and_reviewer
    required_agents: [code-reviewer]
    max_agent_invocations: 2
    parallelizable: true
    human_gate: false
    oracle_note: >-
      Redis adds a local caching/consistency design within the catalog subsystem. The dependency and verification dimensions carry the distributed-system complexity without treating the cache as a system-boundary or storage-ownership migration. `coordinates-distributed-work` alone matches no override — it is only override-eligible in combination, via critical-payment-distributed-consistency. Parallelizable is true, but that does not raise the budget above 2.

  - id: REQ-010
    semantic_hints: {ambiguity: 1, scope: 2, architecture: 2, dependencies: 2, risk: 2, verification: 2}
