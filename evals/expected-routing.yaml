    oracle_note: >-
      T3 still applies via the payment/coordinates-distributed-work/idempotency combination, but critical-payment-distributed-consistency no longer sets a standing human-gate requirement; see CLAUDE.md / docs/claude-to-codex.md §20. Architecture scores 2, but at T3 architecture is main-session work — the critic challenges it rather than a separate architect authoring it. Ambiguity is 1 (the idempotency contract is explicit), so the conditional requirement-analyst does not fire.

  - id: REQ-011
    semantic_hints: {ambiguity: 2, scope: 2, architecture: 2, dependencies: 2, risk: 2, verification: 2}
    raw_score: 12
    signals: [changes-authentication-flow, migrates-data, rolls-out-across-clients, changes-service-contract]
    score_tier: T3
    tier: T3
    strategy: main_with_critic_and_reviewer
    required_agents: [requirement-analyst, architecture-critic, code-reviewer-t3]
    max_agent_invocations: 4
    parallelizable: true
    human_gate: false
    oracle_note: >-
      T3 still applies via identity-model-migration, but that override no longer sets a standing human-gate requirement; see CLAUDE.md / docs/claude-to-codex.md §20. Ambiguity is 2 — "keeping existing users signed in" during the OAuth2/OIDC cutover leaves open whether that means uninterrupted requests, continued refresh-token validity, account-linking continuity, or fallback to old sessions, and a wrong assumption here risks account takeover or mass logout. That fires the conditional requirement-analyst before architecture begins, consuming budget.analyst_reserve.T3 and raising the ceiling from 3 to 4.

  - id: REQ-012
    semantic_hints: {ambiguity: 2, scope: 2, architecture: 2, dependencies: 2, risk: 2, verification: 2}
    raw_score: 12
    signals: [changes-schema, migrates-data, runs-backfill, changes-service-contract, changes-storage-ownership]
    score_tier: T3
    tier: T3
    strategy: main_with_critic_and_reviewer
    required_agents: [requirement-analyst, architecture-critic, code-reviewer-t3]
    max_agent_invocations: 4
    parallelizable: true
    human_gate: false
    oracle_note: >-
      Ambiguity is 2 — the authoritative owner during each rollout phase, conflict resolution between legacy and new writes, the exact rollback boundary, and what "no lost updates" means under concurrent order/fulfillment mutations are all open before a design exists, and a wrong assumption risks silent divergence or irreversible data loss. That fires the conditional requirement-analyst before architecture begins, consuming budget.analyst_reserve.T3 and raising the ceiling from 3 to 4.

  - id: REQ-013
    semantic_hints: {ambiguity: 0, scope: 1, architecture: 0, dependencies: 0, risk: 2, verification: 1}
    raw_score: 4
    signals: [exposes-secret]
    score_tier: T1
    tier: T2
    strategy: main_with_architect_and_reviewer
    required_agents: [code-reviewer]
    max_agent_invocations: 2
    parallelizable: false
    human_gate: false
    oracle_note: >-
      The regression guard for the read-only exemption. Reading the stored secret is `reads-secret-config`, which is exempt and must be dropped before override matching — but returning it over an endpoint is `exposes-secret`, an action, and that must fire security-sensitive and lift a score-4 T1 to T2. A classifier that emits only the exempt read routes this to T1 and fails: that is exactly the disclosure hole the action taxonomy has to close. Architecture is 0, so the conditional architect does not fire.

  - id: REQ-014
    semantic_hints: {ambiguity: 1, scope: 2, architecture: 2, dependencies: 1, risk: 1, verification: 1}
    raw_score: 8
